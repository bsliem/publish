<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>逐句讀誦</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #17130f;
      --panel: #211b15;
      --panel-active: #2b231a;
      --border: #594a38;
      --text: #f4ead8;
      --muted: #b9a991;
      --gold: #d9bd80;
      --green: #9bbca5;
      --font-size: 44px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Songti TC", "Noto Serif TC", "STSong", "PingFang TC", serif;
    }
    button, input, select { font: inherit; }
    button, select { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }
    button:disabled { opacity: .4; }
    main {
      width: min(100%, 820px);
      min-height: 100vh;
      min-height: 100svh;
      margin: auto;
      padding: max(14px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      color: var(--gold);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    #saveStatus { color: var(--green); font: 12px/1.4 system-ui, sans-serif; white-space: nowrap; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      gap: 8px;
      margin-bottom: 12px;
    }
    select, .tool-button, input {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
    }
    select { min-width: 0; padding: 7px 34px 7px 12px; font: 16px system-ui, sans-serif; }
    .tool-button { min-width: 46px; padding: 7px 12px; font: 16px system-ui, sans-serif; cursor: pointer; }
    .search-panel {
      margin: -2px 0 10px;
      padding: 10px;
      border: 1px solid #403528;
      border-radius: 13px;
      background: #1b1712;
      font-family: system-ui, sans-serif;
    }
    .search-panel[hidden] { display: none; }
    .search-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
    }
    .search-form input {
      width: 100%;
      min-width: 0;
      padding: 7px 10px;
      font-size: 16px;
    }
    .search-form button,
    .search-navigation button {
      min-height: 42px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      color: var(--text);
      font: 14px system-ui, sans-serif;
      cursor: pointer;
    }
    .search-navigation {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
    }
    #searchResult {
      flex: 1;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }
    mark {
      padding: 0 .08em;
      border-radius: .12em;
      background: #d9bd80;
      color: #17130f;
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 3px;
      color: var(--muted);
      font: 14px/1.5 system-ui, sans-serif;
    }
    .current-jump {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      white-space: nowrap;
    }
    .current-jump input {
      width: 76px;
      min-height: 36px;
      padding: 5px 7px;
      text-align: center;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .current-jump button {
      min-height: 36px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font: 14px system-ui, sans-serif;
      cursor: pointer;
    }
    #progress {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      min-height: 28px;
      height: 28px;
      margin: -6px 0 8px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
    }
    #progress::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 8px;
      background: linear-gradient(
        to right,
        var(--gold) 0%,
        var(--gold) var(--range-progress, 0%),
        #33291f var(--range-progress, 0%),
        #33291f 100%
      );
    }
    #progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      margin-top: -6.5px;
      border: 2px solid #f4ead8;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 2px #33291f;
    }
    #progress::-moz-range-track {
      height: 7px;
      border-radius: 8px;
      background: #33291f;
    }
    #progress::-moz-range-progress {
      height: 7px;
      border-radius: 8px;
      background: var(--gold);
    }
    #progress::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 2px solid #f4ead8;
      border-radius: 50%;
      background: var(--gold);
    }
    #card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      min-height: 46vh;
      min-height: 46svh;
      padding: 28px 22px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    #card:active:not(:disabled) { background: var(--panel-active); }
    .annotation-area { margin-top: 8px; padding: 9px 11px; border: 1px solid #403528; border-radius: 12px; background: #1b1712; font-family: system-ui, sans-serif; }
    .annotation-area[hidden] { display: none; }
    #annotationButton { min-height: 34px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); color: var(--gold); font-size: 13px; cursor: pointer; }
    #annotationText { display: block; margin-top: 7px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    #annotationText[hidden] { display: none; }
    #sentence {
      max-width: 100%;
      font-size: var(--font-size);
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: .045em;
      overflow-wrap: anywhere;
      text-align: left;
    }
    .context-sentence {
      width: 100%;
      color: var(--muted);
      font-size: max(18px, calc(var(--font-size) * .48));
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: .035em;
      overflow-wrap: anywhere;
      text-align: left;
    }
    .context-sentence.near { opacity: .55; }
    .context-sentence.far { display: none; }
    .context-sentence[hidden] { display: none; }
    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .nav button {
      min-height: 52px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      color: var(--text);
      font: 18px system-ui, sans-serif;
      cursor: pointer;
    }
    .volume-info {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .copy-row {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 34px;
      font-family: system-ui, sans-serif;
    }
    #copyButton { min-height: 34px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--muted); font-size: 13px; cursor: pointer; }
    #copyStatus { position: absolute; left: calc(100% + 5px); color: var(--green); font-size: 12px; white-space: nowrap; }
    .hint { margin: 9px 0 14px; color: #95856e; text-align: center; font: 13px/1.5 system-ui, sans-serif; }
    details {
      margin-top: 14px;
      padding: 13px;
      border: 1px solid #403528;
      border-radius: 14px;
      background: #1b1712;
      font-family: system-ui, sans-serif;
    }
    summary { color: var(--muted); cursor: pointer; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .actions button { min-height: 42px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); color: var(--text); font: 14px system-ui, sans-serif; }
    .note-context { margin: 10px 0 6px; color: var(--muted); font: 13px/1.45 system-ui, sans-serif; }
    .note-fields { display: grid; gap: 8px; }
    .note-fields input, .note-fields textarea { box-sizing: border-box; width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-active); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
    .note-fields input { min-height: 36px; padding: 6px 9px; }
    .note-fields textarea { min-height: 84px; padding: 8px 9px; resize: vertical; }
    .note-list { display: grid; gap: 8px; margin-top: 12px; }
    .note-item { padding: 9px; border: 1px solid #403528; border-radius: 10px; background: var(--panel); }
    .note-meta { color: var(--gold); font: 12px/1.4 system-ui, sans-serif; }
    .note-sentence { margin-top: 5px; color: var(--muted); font-size: 14px; }
    .note-body { margin-top: 5px; white-space: pre-wrap; font: 14px/1.5 system-ui, sans-serif; }
    .note-delete { float: right; border: 0; background: transparent; color: #b9a991; font-size: 12px; cursor: pointer; }
    .note-edit { float: right; margin-right: 9px; border: 0; background: transparent; color: var(--green); font-size: 12px; cursor: pointer; }
    .note-go { float: right; margin-right: 9px; border: 0; background: transparent; color: var(--gold); font-size: 12px; cursor: pointer; }
    #noteNotice { min-height: 0; margin: 8px 0 0; color: var(--green); font: 13px/1.5 system-ui, sans-serif; }
    #noteNotice:empty { display: none; }
    #notice { min-height: 0; margin: 10px 0 0; color: var(--gold); font: 13px/1.5 system-ui, sans-serif; }
    #notice:empty { display: none; }
    @media (min-width: 640px) {
      main { padding-left: 24px; padding-right: 24px; }
      #sentence, .context-sentence { text-align: center; }
    }
    @media (max-width: 520px) {
      main {
        padding: max(10px, env(safe-area-inset-top)) 10px
          calc(max(20px, env(safe-area-inset-bottom)) + 86px);
      }
      header { margin: 0 2px 10px; }
      h1 { font-size: 18px; }
      .toolbar { gap: 6px; margin-bottom: 8px; }
      select { min-height: 42px; padding-left: 10px; }
      .tool-button { min-width: 44px; min-height: 42px; padding: 6px 10px; }
      #searchToggle { min-width: 52px; padding-inline: 8px; font-size: 14px; }
      .search-panel { margin-bottom: 8px; padding: 8px; }
      .search-navigation button { min-height: 38px; padding: 5px 8px; font-size: 13px; }
      .meta { gap: 6px; margin: 6px 2px; font-size: 13px; }
      .current-jump { gap: 3px; }
      .current-jump input { width: 64px; min-height: 34px; padding: 4px; font-size: 16px; }
      .current-jump button { min-height: 34px; padding: 4px 7px; font-size: 13px; }
      #progress { margin-bottom: 4px; }
      #card {
        min-height: 0;
        gap: 10px;
        padding: 20px 14px;
        border-radius: 20px;
      }
      #sentence { line-height: 1.55; letter-spacing: .025em; }
      .context-sentence {
        font-size: max(16px, calc(var(--font-size) * .43));
        line-height: 1.42;
        letter-spacing: .02em;
      }
      .nav { gap: 8px; margin-top: 9px; }
      .nav button { min-height: 48px; padding: 8px; font-size: 17px; }
      #copyButton { min-height: 34px; padding: 4px 7px; font-size: 12px; }
      .hint { margin: 7px 0 10px; font-size: 12px; }
      details { margin-top: 10px; padding: 11px; }
    }
    @media (max-width: 380px) {
      .meta { align-items: stretch; flex-direction: column; }
      .current-jump { justify-content: flex-start; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>日誦</h1>
    <span id="saveStatus">自動儲存</span>
  </header>

  <div class="toolbar">
    <select id="volumeSelect" aria-label="選擇段落"></select>
    <button id="smallerButton" class="tool-button" type="button" aria-label="縮小字體">A−</button>
    <button id="largerButton" class="tool-button" type="button" aria-label="放大字體">A+</button>
    <button id="searchToggle" class="tool-button" type="button" aria-expanded="false" aria-controls="searchPanel">搜尋</button>
  </div>
  <div id="searchPanel" class="search-panel" hidden>
    <div class="search-form">
      <input id="searchInput" type="search" placeholder="搜尋經文，例如：紫金光聚" aria-label="搜尋經文">
      <button id="searchButton" type="button">搜尋</button>
    </div>
    <div class="search-navigation">
      <span id="searchResult" role="status"></span>
      <button id="searchPrevious" type="button" disabled>上一處</button>
      <button id="searchNext" type="button" disabled>下一處</button>
    </div>
  </div>

  <div class="meta">
    <div class="volume-info">
      <span id="volumePosition"></span>
      <div class="copy-row">
        <button id="copyButton" type="button" aria-label="複製前一句、目前句與後一句">複製</button>
        <span id="copyStatus" role="status"></span>
      </div>
    </div>
    <div class="current-jump">
      <span>第</span>
      <input id="jumpInput" type="number" inputmode="numeric" min="1" step="1" aria-label="本節句次">
      <span>/ <span id="chapterTotal"></span>句</span>
      <button id="jumpButton" type="button">前往</button>
    </div>
  </div>
  <input id="progress" type="range" min="1" value="1" aria-label="拖曳至本節指定句">

  <button id="card" type="button" aria-label="已誦此句，顯示下一句">
    <span id="previousTwo" class="context-sentence far" aria-hidden="true"></span>
    <span id="previousOne" class="context-sentence near" aria-hidden="true"></span>
    <span id="sentence" lang="zh-Hant"></span>
    <span id="nextOne" class="context-sentence near" aria-hidden="true"></span>
    <span id="nextTwo" class="context-sentence far" aria-hidden="true"></span>
  </button>
  <div id="annotationArea" class="annotation-area" hidden>
    <button id="annotationButton" type="button" aria-expanded="false">註解</button>
    <span id="annotationText" hidden></span>
  </div>

  <nav class="nav" aria-label="切換經句">
    <button id="previousButton" type="button">← 上一句</button>
    <button id="nextButton" type="button">下一句 →</button>
  </nav>
  <p id="hint" class="hint">點按經句或空白鍵：下一句 · ← → 切換 · ↑ ↓ 捲動</p>

  <details>
    <summary>進度備份</summary>
    <div class="actions">
      <button id="restartButton" type="button">重新開始本節</button>
      <button id="exportButton" type="button">匯出進度</button>
      <button id="importButton" type="button">匯入進度</button>
    </div>
    <p id="notice" role="status"></p>
  </details>
  <details>
    <summary>筆記</summary>
    <p id="noteContext" class="note-context"></p>
    <div class="note-fields">
      <input id="noteAudioTime" type="text" inputmode="text" placeholder="MP3 時間，例如：12:34" aria-label="MP3 時間">
      <textarea id="noteText" placeholder="寫下意義、心得、提醒或待辦事項…" aria-label="筆記內容"></textarea>
    </div>
    <div class="actions">
      <button id="saveNoteButton" type="button">儲存筆記</button>
      <button id="cancelNoteEditButton" type="button" hidden>取消編輯</button>
    </div>
    <p id="noteNotice" role="status"></p>
    <div id="noteList" class="note-list"></div>
  </details>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
</main>

<script id="sutraSource" type="text/plain">
## 地藏菩薩本願經
### 01 忉利天宮神通品第一
如是我聞。一時佛在忉利天，為母說法.
爾時十方無量世界，不可說不可說一切諸佛，及大菩薩摩訶薩，皆來集會。讚歎釋迦牟尼佛，能於五濁惡世，現不可思議大智慧神通之力，調伏剛強眾生，知苦樂法，各遣侍者，問訊世尊.
是時，如來含笑，放百千萬億大光明雲，所謂大圓滿光明雲、大慈悲光明雲、大智慧光明雲、大般若光明雲、大三昧光明雲、大吉祥光明雲、大福德光明雲、大功德光明雲、大歸依光明雲、大讚歎光明雲，放如是等不可說光明雲已.
又出種種微妙之音，所謂檀波羅蜜音、尸波羅蜜音、羼提波羅密音、毗離耶波羅蜜音、禪波羅蜜音、般若波羅密音、慈悲音、喜捨音、解脫音、無漏音、智慧音、大智慧音、師子吼音、大師子吼音、雲雷音、大雲雷音.
出如是等不可說不可說音已，娑婆世界，及他方國土，有無量億天龍鬼神，亦集到忉利天宮，所謂四天王天、忉利天、須燄摩天、兜率陀天、化樂天、他化自在天、梵眾天、梵輔天、大梵天、少光天、無量光天、光音天、少淨天、無量淨天、遍淨天、福生天、福愛天、廣果天、無想天、無煩天、無熱天、善見天、善現天、色究竟天、摩醯首羅天、乃至非想非非想處天，一切天眾、龍眾、鬼神等眾，悉來集會.
復有他方國土，及娑婆世界，海神、江神、河神、樹神、山神、地神、川澤神、苗稼神、晝神、夜神、空神、天神、飲食神、草木神，如是等神，皆來集會.
復有他方國土，及娑婆世界，諸大鬼王。所謂：惡目鬼王、噉血鬼王、噉精氣鬼王、噉胎卵鬼王、行病鬼王、攝毒鬼王、慈心鬼王、福利鬼王、大愛敬鬼王，如是等鬼王，皆來集會.
爾時釋迦牟尼佛、告文殊師利法王子菩薩摩訶薩：汝觀是一切諸佛菩薩及天龍鬼神，此世界、他世界，此國土、他國土，如是今來集會到忉利天者，汝知數不？
文殊師利白佛言：世尊，若以我神力，千劫測度，不能得知.
佛告文殊師利：吾以佛眼觀故，猶不盡數。此皆是地藏菩薩久遠劫來，已度、當度、未度，已成就、當成就、未成就.
文殊師利白佛言：世尊，我已過去久修善根、證無礙智。聞佛所言，即當信受。小果聲聞、天龍八部、及未來世諸眾生等，雖聞如來誠實之語，必懷疑惑。設使頂受，未免興謗。唯願世尊、廣說地藏菩薩摩訶薩，因地作何行？立何願？而能成就不思議事.
佛告文殊師利：譬如三千大千世界所有草木叢林、稻麻竹葦、山石微塵，一物一數，作一恆河；一恆河沙，一沙一界；一界之內、一塵一劫，一劫之內，所積塵數，盡充為劫，地藏菩薩證十地果位以來，千倍多於上喻。何況地藏菩薩在聲聞、辟支佛地.
文殊師利，此菩薩威神誓願，不可思議。若未來世，有善男子、善女人，聞是菩薩名字，或讚歎、或瞻禮、或稱名、或供養，乃至彩畫刻鏤塑漆形像，是人當得百返生於三十三天，永不墮惡道.
文殊師利，是地藏菩薩摩訶薩，於過去久遠不可說、不可說劫前，身為大長者子。時世有佛，號曰師子奮迅具足萬行如來。時長者子，見佛相好，千福莊嚴，因問彼佛：作何行願，而得此相？時師子奮迅具足萬行如來告長者子：欲證此身，當須久遠度脫一切受苦眾生.
文殊師利！時長者子，因發願言：我今盡未來際不可計劫，為是罪苦六道眾生，廣設方便，盡令解脫，而我自身，方成佛道。以是於彼佛前，立斯大願，于今百千萬億那由他不可說劫，尚為菩薩.
又於過去，不可思議阿僧祇劫，時世有佛，號曰覺華定自在王如來，彼佛壽命，四百千萬億阿僧祇劫。像法之中，有一婆羅門女，宿福深厚，眾所欽敬；行住坐臥，諸天衛護。其母信邪，常輕三寶.
是時聖女廣設方便，勸誘其母，令生正見，而此女母，未全生信。不久命終，魂神墮在無間地獄。時婆羅門女，知母在世，不信因果。計當隨業，必生惡趣。遂賣家宅，廣求香華，及諸供具，於先佛塔寺，大興供養。見覺華定自在王如來，其形像在一寺中，塑畫威容，端嚴畢備.
時婆羅門女，瞻禮尊容，倍生敬仰。私自念言：佛名大覺，具一切智。若在世時，我母死後，儻來問佛，必知處所。時婆羅門女，垂泣良久，瞻戀如來。忽聞空中聲曰：泣者聖女，勿至悲哀，我今示汝母之去處。婆羅門女合掌向空，而白空曰：是何神德，寬我憂慮。我自失母以來，晝夜憶戀，無處可問知母生界。時空中有聲，再報女曰：我是汝所瞻禮者，過去覺華定自在王如來，見汝憶母，倍於常情眾生之分，故來告示.
婆羅門女聞此聲已，舉身自撲，肢節皆損。左右扶侍，良久方蘇。而白空曰：願佛慈愍，速說我母生界，我今身心，將死不久。時覺華定自在王如來，告聖女曰：汝供養畢，但早返舍，端坐思惟吾之名號，即當知母所生去處.
時婆羅門女尋禮佛已，即歸其舍。以憶母故，端坐念覺華定自在王如來。經一日一夜，忽見自身到一海邊。其水涌沸，多諸惡獸，盡復鐵身，飛走海上，東西馳逐。見諸男子女人，百千萬數，出沒海中，被諸惡獸爭取食噉。又見夜叉，其形各異，或多手多眼、多足多頭、口牙外出，利刃如劍。驅諸罪人，使近惡獸，復自搏攫，頭足相就。其形萬類，不敢久視.
時婆羅門女，以念佛力故，自然無懼。有一鬼王，名曰無毒，稽首來迎，白聖女曰：善哉，菩薩，何緣來此？
時婆羅門女問鬼王曰：此是何處？
無毒答曰：此是大鐵圍山西面第一重海.
聖女問曰：我聞鐵圍之內，地獄在中，是事實否？
無毒答曰：實有地獄.
聖女問曰：我今云何得到獄所？
無毒答曰：若非威神，即須業力，非此二事，終不能到.
聖女又問：此水何緣，而乃涌沸，多諸罪人，及以惡獸？
無毒答曰：此是閻浮提造惡眾生，新死之者，經四十九日後，無人繼嗣，為作功德，救拔苦難，生時又無善因。當據本業所感地獄，自然先渡此海。海東十萬由旬，又有一海，其苦倍此。彼海之東，又有一海，其苦復倍。三業惡因之所招感，共號業海，其處是也.
聖女又問鬼王無毒曰：地獄何在？
無毒答曰：三海之內，是大地獄，其數百千，各各差別。所謂大者，具有十八。次有五百，苦毒無量。次有千百，亦無量苦.
聖女又問大鬼王曰：我母死來未久，不知魂神當至何趣？
鬼王問聖女曰：菩薩之母，在生習何行業？
聖女答曰：我母邪見，譏毀三寶。設或暫信，旋又不敬。死雖日淺，未知生處.
無毒問曰：菩薩之母，姓氏何等？
聖女答曰：我父我母，俱婆羅門種，父號尸羅善現，母號悅帝利.
無毒合掌啟菩薩曰：願聖者卻返本處，無至憂憶悲戀。悅帝利罪女，生天以來，經今三日。云承孝順之子，為母設供修福，布施覺華定自在王如來塔寺。非唯菩薩之母，得脫地獄，應是無間罪人，此日悉得受樂，俱同生訖.
鬼王言畢，合掌而退。婆羅門女，尋如夢歸。悟此事已，便於覺華定自在王如來塔像之前，立弘誓願：願我盡未來劫，應有罪苦眾生，廣設方便，使令解脫.
佛告文殊師利：時鬼王無毒者，當今財首菩薩是。婆羅門女者，即地藏菩薩是.
### 02 分身集會品第二
爾時百千萬億不可思、不可議、不可量、不可說無量阿僧祇世界，所有地獄處，分身地藏菩薩，俱來集在忉利天宮。以如來神力故，各以方面，與諸得解脫從業道出者，亦各有千萬億那由他數，共持香華，來供養佛。
彼諸同來等輩，皆因地藏菩薩教化，永不退轉於阿耨多羅三藐三菩提。是諸眾等，久遠劫來，流浪生死，六道受苦，暫無休息。以地藏菩薩廣大慈悲，深誓願故，各獲果證。既至忉利，心懷踴躍，瞻仰如來，目不暫捨。
爾時，世尊舒金色臂，摩百千萬億不可思、不可議、不可量、不可說、無量阿僧祇世界諸分身地藏菩薩摩訶薩頂，而作是言：吾於五濁惡世，教化如是剛強眾生，令心調伏，捨邪歸正，十有一二，尚惡習在。吾亦分身千百億，廣設方便。或有利根，聞即信受；或有善果，勤勸成就；或有暗鈍，久化方歸；或有業重，不生敬仰。如是等輩眾生，各各差別，分身度脫。
或現男子身、或現女人身、或現天龍身、或現神鬼身、或現山林川原、河池泉井，利及於人，悉皆度脫。或現天帝身、或現梵王身、或現轉輪王身、或現居士身、或現國王身、或現宰輔身、或現官屬身、或現比丘、比丘尼、優婆塞、優婆夷身、乃至聲聞、羅漢、辟支佛、菩薩等身、而以化度。非但佛身，獨現其前。
汝觀吾累劫勤苦，度脫如是等難化剛強罪苦眾生。其有未調伏者，隨業報應。若墮惡趣，受大苦時，汝當憶念吾在忉利天宮，殷懃付囑。令娑婆世界，至彌勒出世已來眾生，悉使解脫，永離諸苦，遇佛授記。
爾時，諸世界分身地藏菩薩，共復一形，涕淚哀戀，白其佛言：我從久遠劫來，蒙佛接引，使獲不可思議神力，具大智慧。我所分身，遍滿百千萬億恆河沙世界，每一世界化百千萬億身，每一身度百千萬億人，令歸敬三寶，永離生死，至涅槃樂。但於佛法中所為善事，一毛一渧，一沙一塵，或毫髮許，我漸度脫，使獲大利。唯願世尊，不以後世惡業眾生為慮。
如是三白佛言：唯願世尊，不以後世惡業眾生為慮。
爾時，佛讚地藏菩薩言：善哉！善哉！吾助汝喜。汝能成就久遠劫來，發弘誓願，廣度將畢，即證菩提。
### 03 觀眾生業緣品第三
爾時佛母摩耶夫人，恭敬合掌問地藏菩薩言：聖者，閻浮眾生，造業差別，所受報應，其事云何？地藏答言：千萬世界，乃及國土，或有地獄、或無地獄；或有女人、或無女人；或有佛法、或無佛法，乃至聲聞辟支佛，亦復如是，非但地獄罪報一等。
摩耶夫人重白菩薩：且願聞於閻浮罪報所感惡趣。
地藏答言：聖母，唯願聽受，我粗說之。
佛母白言：願聖者說。
爾時地藏菩薩白聖母言：南閻浮提，罪報名號如是。若有眾生不孝父母，或至殺害，當墮無間地獄，千萬億劫求出無期。若有眾生出佛身血，毀謗三寶，不敬尊經，亦當墮於無間地獄，千萬億劫，求出無期。若有眾生侵損常住，玷污僧尼，或伽藍內恣行婬欲，或殺或害，如是等輩，當墮無間地獄，千萬億劫，求出無期。若有眾生，偽作沙門，心非沙門，破用常住，欺誑白衣，違背戒律，種種造惡，如是等輩，當墮無間地獄，千萬億劫，求出無期。若有眾生，偷竊常住財物穀米，飲食衣服，乃至一物不與取者，當墮無間地獄，千萬億劫，求出無期。
地藏白言：聖母，若有眾生，作如是罪，當墮五無間地獄，求暫停苦一念不得。
摩耶夫人重白地藏菩薩言：云何名為無間地獄？
地藏白言：聖母，諸有地獄在大鐵圍山之內，其大地獄有一十八所，次有五百，名號各別，次有千百，名字亦別。無間獄者，其獄城周匝八萬餘里，其城純鐵，高一萬里，城上火聚，少有空缺。其獄城中，諸獄相連，名號各別。獨有一獄，名曰無間，其獄周匝萬八千里，獄牆高一千里，悉是鐵圍，上火徹下，下火徹上。鐵蛇鐵狗，吐火馳逐獄牆之上，東西而走。
獄中有床，遍滿萬里。一人受罪，自見其身遍臥滿床。千萬人受罪，亦各自見身滿床上。眾業所感獲報如是。
又諸罪人，備受眾苦。千百夜叉及以惡鬼，口牙如劍，眼如電光，手復銅爪，拖拽罪人。復有夜叉執大鐵戟，中罪人身，或中口鼻，或中腹背。拋空翻接或置床上，復有鐵鷹啗罪人目。復有鐵蛇絞罪人頸。百肢節內，悉下長釘，拔舌耕犁，抽腸剉斬，烊銅灌口，熱鐵纏身。萬死千生，業感如是。動經億劫，求出無期。
此界壞時，寄生他界，他界次壞，轉寄他方；他方壞時，輾轉相寄。此界成後，還復而來。無間罪報，其事如是。
又五事業感，故稱無間。何等為五？
一者、日夜受罪，以至劫數，無時間絕，故稱無間。
二者、一人亦滿，多人亦滿，故稱無間。
三者、罪器叉棒，鷹蛇狼犬，碓磨鋸鑿，剉斫鑊湯，鐵網鐵繩，鐵驢鐵馬，生革絡首，熱鐵澆身，飢吞鐵丸，渴飲鐵汁，從年竟劫，數那由他，苦楚相連，更無間斷，故稱無間。
四者、不問男子女人，羌胡夷狄，老幼貴賤，或龍或神，或天或鬼，罪行業感，悉同受之，故稱無間。
五者、若墮此獄，從初入時，至百千劫，一日一夜，萬死萬生，求一念間暫住不得，除非業盡，方得受生，以此連綿，故稱無間。
地藏菩薩白聖母言：無間地獄，粗說如是。若廣說地獄罪器等名，及諸苦事，一劫之中，求說不盡。摩耶夫人聞已，愁憂合掌，頂禮而退。
### 04 閻浮眾生業感品第四
爾時地藏菩薩摩訶薩白佛言：世尊，我承佛如來威神力故，遍百千萬億世界，分是身形，救拔一切業報眾生。若非如來大慈力故，即不能作如是變化。我今又蒙佛付囑，至阿逸多成佛以來，六道眾生，遣令度脫。唯然世尊，願不有慮。
爾時佛告地藏菩薩：一切眾生未解脫者，性識無定，惡習結業，善習結果。為善為惡，逐境而生。輪轉五道，暫無休息，動經塵劫，迷惑障難。如魚游網。將是長流，脫入暫出，又復遭網。以是等輩，吾當憂念。汝既畢是往願，累劫重誓，廣度罪輩，吾復何慮。
說是語時，會中有一菩薩摩訶薩，名定自在王，白佛言：世尊，地藏菩薩累劫以來，各發何願，今蒙世尊慇懃讚歎。唯願世尊，略而說之。
爾時世尊告定自在王菩薩：諦聽諦聽！善思念之！吾當為汝分別解說。乃往過去無量阿僧祇那由他不可說劫，爾時有佛，號一切智成就如來，應供、正遍知、明行足、善逝、世間解、無上士、調御丈夫、天人師、佛、世尊，其佛壽命六萬劫。未出家時為小國王，與一鄰國王為友，同行十善，饒益眾生。其鄰國內所有人民，多造眾惡。二王議計，廣設方便。一王發願，早成佛道，當度是輩，令使無餘。一王發願，若不先度罪苦，令是安樂，得至菩提，我終未願成佛。
佛告定自在王菩薩：一王發願早成佛者，即一切智成就如來是。一王發願永度罪苦眾生，未願成佛者，即地藏菩薩是。
復於過去無量阿僧祇劫，有佛出世，名清淨蓮華目如來，其佛壽命四十劫。像法之中，有一羅漢，福度眾生。因次教化，遇一女人，字曰光目，設食供養。
羅漢問之：欲願何等？
光目答曰：我以母亡之日，資福救拔，未知我母生處何趣？
羅漢愍之，為入定觀，見光目女母墮在惡趣，受極大苦。羅漢問光目言：汝母在生，作何行業？今在惡趣，受極大苦。
光目答言：我母所習，唯好食噉魚鱉之屬。所食魚鱉，多食其子，或炒或煮，恣情食噉，計其命數，千萬復倍。尊者慈愍，如何哀救？
羅漢愍之，為作方便，勸光目言：汝可志誠念清淨蓮華目如來，兼塑畫形像，存亡獲報。
光目聞已，即捨所愛，尋畫佛像而供養之，復恭敬心，悲泣瞻禮。忽於夜後，夢見佛身金色晃耀，如須彌山，放大光明。而告光目：汝母不久當生汝家，纔覺飢寒，即當言說。
其後家內婢生一子，未滿三日，而乃言說。稽首悲泣，告於光目：生死業緣，果報自受，吾是汝母，久處暗冥。自別汝來，累墮大地獄。蒙汝福力，方得受生。為下賤人，又復短命。壽年十三，更落惡道。汝有何計，令吾脫免？
光目聞說，知母無疑，哽咽悲啼而白婢子：既是我母，合知本罪，作何行業，墮於惡道。
婢子答言：以殺害毀罵二業受報。若非蒙福，救拔吾難，以是業故，未合解脫。
光目問言：地獄罪報，其事云何？
婢子答言：罪苦之事，不忍稱說，百千歲中，卒白難竟。
光目聞已，啼淚號泣而白空界：願我之母，永脫地獄，畢十三歲，更無重罪，及歷惡道。十方諸佛慈哀愍我，聽我為母所發廣大誓願。若得我母永離三途及斯下賤，乃至女人之身永劫不受者。願我自今日後，對清淨蓮華目如來像前，卻後百千萬億劫中，應有世界，所有地獄及三惡道諸罪苦眾生，誓願救拔，令離地獄惡趣，畜生餓鬼等，如是罪報等人，盡成佛竟，我然後方成正等正覺。
發誓願已，具聞清淨蓮華目如來而告之曰：光目，汝大慈愍，善能為母發如是大願。吾觀汝母十三歲畢，捨此報已，生為梵志，壽年百歲。過是報後，當生無憂國土，壽命不可計劫。後成佛果，廣度人天，數如恆河沙。
佛告定自在王：爾時羅漢福度光目者，即無盡意菩薩是。光目母者，即解脫菩薩是，光目女者即地藏菩薩是。過去久遠劫中，如是慈愍，發恆河沙願，廣度眾生。未來世中，若有男子女人，不行善者行惡者，乃至不信因果者，邪婬妄語者，兩舌惡口者，毀謗大乘者，如是諸業眾生，必墮惡趣。若遇善知識，勸令一彈指間，歸依地藏菩薩，是諸眾生，即得解脫三惡道報。若能志心歸敬及瞻禮讚歎，香華衣服，種種珍寶，或復飲食，如是奉事者。未來百千萬億劫中，常在諸天受勝妙樂。若天福盡，下生人間，猶百千劫常為帝王，能憶宿命因果本末。
定自在王！如是地藏菩薩有如此不可思議大威神力，廣利眾生汝等諸菩薩當記是經廣宣流布。
定自在王白佛言：世尊，願不有慮。我等千萬億菩薩摩訶薩，必能承佛威神廣演是經，於閻浮提利益眾生。定自在王菩薩白世尊已，合掌恭敬作禮而退。
爾時四方天王俱從座起，合掌恭敬白佛言：世尊，地藏菩薩於久遠劫來，發如是大願，云何至今猶度未絕，更發廣大誓言。唯願世尊為我等說。
佛告四天王：善哉善哉！吾今為汝及未來現在天人眾等，廣利益故，說地藏菩薩於娑婆世界，閻浮提內生死道中，慈哀救拔，度脫一切罪苦眾生方便之事。
四天王言：唯然世尊，願樂欲聞。
佛告四天王：地藏菩薩久遠劫來，迄至於今，度脫眾生，猶未畢願，慈愍此世罪苦眾生。復觀未來無量劫中，因蔓不斷，以是之故，又發重願。如是菩薩於娑婆世界，閻浮提中，百千萬億方便，而為教化。
四天王，地藏菩薩若遇殺生者，說宿殃短命報。若遇竊盜者，說貧窮苦楚報。若遇邪婬者，說雀鴿鴛鴦報。若遇惡口者，說眷屬鬥諍報。若遇毀謗者，說無舌瘡口報。若遇瞋恚者，說醜陋癃殘報。若遇慳吝者，說所求違願報。若遇飲食無度者，說飢渴咽病報。若遇畋獵恣情者，說驚狂喪命報。若遇悖逆父母者，說天地災殺報。若遇燒山林木者，說狂迷取死報。若遇前後父母惡毒者，說返生鞭撻現受報。若遇網捕生雛者，說骨肉分離報。若遇毀謗三寶者，說盲聾瘖啞報。若遇輕法慢教者，說永處惡道報。若遇破用常住者，說億劫輪迴地獄報。若遇污梵誣僧者，說永在畜生報。若遇湯火斬斫傷生者，說輪迴遞償報。若遇破戒犯齋者，說禽獸飢餓報。若遇非理毀用者，說所求闕絕報。若遇吾我貢高者，說卑使下賤報。若遇兩舌鬥亂者，說無舌百舌報。若遇邪見者，說邊地受生報。
如是等閻浮提眾生，身口意業，惡習結果，百千報應，今粗略說。如是等閻浮提眾生業感差別，地藏菩薩百千方便而教化之。是諸眾生，先受如是等報，後墮地獄，動經劫數，無有出期。是故汝等護人護國，無令是諸眾業迷惑眾生。
四天王聞已，涕淚悲歎合掌而退。
### 05 地獄名號品第五
爾時普賢菩薩摩訶薩白地藏菩薩言：仁者，願為天龍四眾，及未來現在一切眾生，說娑婆世界，及閻浮提罪苦眾生，所受報處，地獄名號，及惡報等事，使未來世末法眾生，知是果報。
地藏答言：仁者，我今承佛威神，及大士之力，略說地獄名號，及罪報惡報之事。
仁者，閻浮提東方有山，號曰鐵圍，其山黑邃，無日月光。
有大地獄，號極無間，又有地獄，名大阿鼻。復有地獄，名曰四角；復有地獄，名曰飛刀；復有地獄，名曰火箭；復有地獄，名曰夾山；復有地獄，名曰通槍；復有地獄，名曰鐵車；復有地獄，名曰鐵床；復有地獄，名曰鐵牛；復有地獄，名曰鐵衣；復有地獄，名曰千刃；復有地獄，名曰鐵驢；復有地獄，名曰烊銅；復有地獄，名曰抱柱；復有地獄，名曰流火；復有地獄，名曰耕舌；復有地獄，名曰剉首；復有地獄，名曰燒腳；復有地獄，名曰啗眼；復有地獄，名曰鐵丸；復有地獄，名曰諍論；復有地獄，名曰鐵鈇；復有地獄，名曰多瞋。
地藏白言：仁者，鐵圍之內，有如是等地獄，其數無限。
更有叫喚地獄，拔舌地獄，糞尿地獄，銅鎖地獄，火象地獄，火狗地獄，火馬地獄，火牛地獄，火山地獄，火石地獄，火床地獄，火梁地獄，火鷹地獄，鋸牙地獄，剝皮地獄，飲血地獄，燒手地獄，燒腳地獄，倒刺地獄，火屋地獄，鐵屋地獄，火狼地獄。如是等地獄。
其中各各復有諸小地獄，或一、或二、或三、或四、乃至百千，其中名號，各各不同。
地藏菩薩告普賢菩薩言：仁者，此者皆是南閻浮提行惡眾生，業感如是。業力甚大，能敵須彌，能深巨海，能障聖道。是故眾生莫輕小惡，以為無罪，死後有報，纖毫受之。父子至親，歧路各別，縱然相逢，無肯代受。我今承佛威力，略說地獄罪報之事，唯願仁者暫聽是言。
普賢答言：吾已久知三惡道報，望仁者說，令後世末法一切惡行眾生，聞仁者說，使令歸佛。
地藏白言：仁者，地獄罪報，其事如是。
或有地獄，取罪人舌，使牛耕之。或有地獄取罪人心，夜叉食之。或有地獄，鑊湯盛沸，煮罪人身。或有地獄，赤燒銅柱，使罪人抱。或有地獄，使諸火燒，趁及罪人。或有地獄，一向寒冰。或有地獄，無限糞尿。或有地獄，純飛鈒鑗。或有地獄，多攢火槍。或有地獄，唯撞胸背。或有地獄，但燒手足。或有地獄，盤繳鐵蛇。或有地獄，驅逐鐵狗。或有地獄，盡駕鐵騾。
仁者，如是等報，各各獄中，有百千種業道之器，無非是銅是鐵，是石是火，此四種物，眾業行感。若廣說地獄罪報等事，一一獄中，更有百千種苦楚，何況多獄。我今承佛威神及仁者問，略說如是。若廣解說，窮劫不盡。
### 06 如來讚歎品第六
爾時世尊舉身放大光明，遍照百千萬億恆河沙等諸佛世界。出大音聲，普告諸佛世界一切諸菩薩摩訶薩，及天、龍、鬼、神、人、非人等。聽吾今日稱揚讚歎地藏菩薩摩訶薩，於十方世界，現大不可思議威神慈悲之力，救護一切罪苦之事。吾滅度後，汝等諸菩薩大士，及天龍鬼神等，廣作方便，衛護是經，令一切眾生證涅槃樂。
說是語已，會中有一菩薩，名曰普廣，合掌恭敬而白佛言：今見世尊讚歎地藏菩薩，有如是不可思議大威神德，唯願世尊為未來世末法眾生，宣說地藏菩薩利益人天因果等事，使諸天龍八部，及未來世眾生，頂受佛語。
爾時世尊告普廣菩薩及四眾等：諦聽諦聽！吾當為汝略說地藏菩薩利益人天福德之事。
普廣白言：唯然！世尊，願樂欲聞。
佛告普廣菩薩：未來世中，若有善男子、善女人，聞是地藏菩薩摩訶薩名者，或合掌者、讚歎者、作禮者、戀慕者，是人超越三十劫罪。
普廣，若有善男子、善女人，或彩畫形像，或土石膠漆，金銀銅鐵、作此菩薩，一瞻一禮者，是人百返生於三十三天，永不墮於惡道。假如天福盡故，下生人間，猶為國王，不失大利。
若有女人，厭女人身，盡心供養地藏菩薩畫像，及土石膠漆銅鐵等像，如是日日不退，常以華香、飲食、衣服、繒綵、幢旛、錢、寶物等供養。是善女人，盡此一報女身，百千萬劫，更不生有女人世界，何況復受。除非慈願力故，要受女身，度脫眾生，承斯供養地藏力故，及功德力，百千萬劫不受女身。
復次普廣：若有女人，厭是醜陋，多疾病者，但於地藏像前，志心瞻禮，食頃之間。是人千萬劫中，所受生身，相貌圓滿。是醜陋女人，如不厭女身，即百千萬億生中，常為王女，乃及王妃，宰輔大姓，大長者女，端正受生，諸相圓滿。由志心故，瞻禮地藏菩薩，獲福如是。
復次普廣：若有善男子、善女人，能對菩薩像前，作諸伎樂，及歌詠讚歎，香華供養，乃至勸於一人多人。如是等輩，現在世中及未來世，常得百千鬼神日夜衛護，不令惡事輒聞其耳，何況親受諸橫。
復次普廣：未來世中，若有惡人及惡神惡鬼，見有善男子、善女人，歸敬供養讚歎瞻禮地藏菩薩形像，或妄生譏毀，謗無功德及利益事，或露齒笑，或背面非，或勸人共非，或一人非，或多人非，乃至一念生譏毀者。如是之人，賢劫千佛滅度，譏毀之報，尚在阿鼻地獄受極重罪。過是劫已，方受餓鬼。又經千劫，復受畜生。又經千劫，方得人身。縱受人身，貧窮下賤，諸根不具，多被惡業來結其心。不久之間，復墮惡道。是故普廣，譏毀他人供養，尚獲此報，何況別生惡見毀滅。
復次普廣：若未來世，有男子女人，久處床枕，求生求死，了不可得。或夜夢惡鬼，乃及家親、或遊險道、或多魘寐、共鬼神遊。日月歲深，轉復尪瘵，眠中叫苦，慘悽不樂者。此皆是業道論對，未定輕重，或難捨壽、或不得癒，男女俗眼，不辨是事。
但當對諸佛菩薩像前，高聲轉讀此經一遍。或取病人可愛之物，或衣服、寶貝，莊園、舍宅，對病人前，高聲唱言：我某甲等，為是病人對經像前捨諸等物，或供養經像、或造佛菩薩形像、或造塔寺、或燃油燈、或施常住。如是三白病人，遣令聞知。
假令諸識分散，至氣盡者，乃至一日、二日、三日、四日至七日以來。但高聲白，高聲讀經。是人命終之後。宿殃重罪，至於五無間罪，永得解脫，所受生處，常知宿命。何況善男子善女人自書此經或教人書、或自塑畫菩薩形像乃至教人塑畫。所受果報，必獲大利。
是故普廣，若見有人讀誦是經，乃至一念讚歎是經，或恭敬者。汝須百千方便，勸是等人，勤心莫退，能得未來、現在千萬億不可思議功德。
復次普廣：若未來世諸眾生等，或夢或寐，見諸鬼神乃及諸形，或悲、或啼、或愁、或嘆、或恐、或怖。此皆是一生十生百生千生過去父母、男女弟妹、夫妻眷屬，在於惡趣，未得出離，無處希望福力救拔，當告宿世骨肉，使作方便，願離惡道。
普廣，汝以神力，遣是眷屬，令對諸佛菩薩像前，志心自讀此經，或請人讀，其數三遍或七遍。如是惡道眷屬，經聲畢是遍數，當得解脫，乃至夢寐之中，永不復見。
復次普廣：若未來世，有諸下賤等人，或奴或婢，乃至諸不自由之人，覺知宿業，要懺悔者。志心瞻禮地藏菩薩形像，乃至一七日中，念菩薩名，可滿萬遍。如是等人，盡此報後，千萬生中，常生尊貴，更不經三惡道苦。
復次普廣：若未來世中，閻浮提內，剎利、婆羅門、長者、居士、一切人等，及異姓種族，有新產者，或男或女，七日之中，早與讀誦此不可思議經典，更為念菩薩名，可滿萬遍。是新生子，或男或女，宿有殃報，便得解脫，安樂易養，壽命增長。若是承福生者，轉增安樂，及與壽命。
復次普廣：若未來世眾生，於月一日、八日、十四日、十五日、十八日、二十三、二十四、二十八、二十九日、乃至三十日，是諸日等，諸罪結集，定其輕重。南閻浮提眾生，舉止動念，無不是業，無不是罪，何況恣情殺害、竊盜、邪婬、妄語、百千罪狀。能於是十齋日，對佛菩薩諸賢聖像前，讀是經一遍，東西南北百由旬內，無諸災難。
當此居家，若長若幼，現在未來百千歲中，永離惡趣。能於十齋日每轉一遍，現世令此居家無諸橫病，衣食豐溢。是故普廣，當知地藏菩薩有如是等不可說百千萬億大威神力，利益之事。
閻浮眾生，於此大士有大因緣。是諸眾生，聞菩薩名，見菩薩像，乃至聞是經三字五字，或一偈一句者，現在殊妙安樂，未來之世，百千萬生，常得端正，生尊貴家。
爾時普廣菩薩聞佛如來稱揚讚歎地藏菩薩已，胡跪合掌復白佛言：世尊，我久知是大士有如此不可思議神力，及大誓願力，為未來眾生遣知利益，故問如來，唯然頂受。
世尊，當何名此經，使我云何流布？
佛告普廣：此經有三名：一名地藏本願，亦名地藏本行，亦名地藏本誓力經。緣此菩薩，久遠劫來，發大重願，利益眾生，是故汝等，依願流布。
普廣聞已，合掌恭敬作禮而退。
### 07 利益存亡品第七
爾時地藏菩薩摩訶薩白佛言：世尊，我觀是閻浮眾生，舉心動念，無非是罪。脫獲善利，多退初心。若遇惡緣，念念增益。是等輩人，如履泥塗，負於重石，漸困漸重，足步深邃。若得遇知識，替與減負，或全與負。是知識有大力故，復相扶助，勸令牢腳。若達平地，須省惡路，無再經歷。
世尊，習惡眾生，從纖毫間，便至無量。是諸眾生有如此習，臨命終時，父母眷屬，宜為設福，以資前路。或懸旛蓋及燃油燈。或轉讀尊經、或供養佛像及諸聖像，乃至念佛菩薩，及辟支佛名字，一名一號，歷臨終人耳根，或聞在本識。是諸眾生所造惡業，計其感果，必墮惡趣，緣是眷屬為臨終人修此聖因，如是眾罪，悉皆消滅。
若能更為身死之後，七七日內，廣造眾善。能使是諸眾生永離惡趣，得生人天，受勝妙樂，現在眷屬，利益無量。
是故我今對佛世尊，及天龍八部人非人等，勸於閻浮提眾生臨終之日，慎勿殺害，及造惡緣，拜祭鬼神，求諸魍魎。
何以故？爾所殺害乃至拜祭，無纖毫之力，利益亡人，但結罪緣，轉增深重。假使來世或現在生，得獲聖分，生人天中。緣是臨終被諸眷屬造是惡因，亦令是命終人殃累對辯，晚生善處。何況臨命終人，在生未曾有少善根，各據本業，自受惡趣，何忍眷屬更為增業。
譬如有人從遠地來，絕糧三日，所負擔物，強過百斤，忽遇鄰人，更附少物，以是之故，轉復困重。
世尊，我觀閻浮眾生，但能於諸佛教中，乃至善事，一毛一渧，一沙一塵，如是利益，悉皆自得。
說是語時，會中有一長者，名曰大辯，是長者久證無生，化度十方，現長者身，合掌恭敬，問地藏菩薩言：大士，是南閻浮提眾生，命終之後，小大眷屬，為修功德，乃至設齋，造眾善因，是命終人，得大利益及解脫不？
地藏答言：長者，我今為未來現在一切眾生，承佛威力，略說是事。長者，未來現在諸眾生等，臨命終日，得聞一佛名、一菩薩名、一辟支佛名，不問有罪無罪，悉得解脫。若有男子女人，在生不修善因多造眾罪。命終之後，眷屬小大，為造福利一切聖事，七分之中而乃獲一，六分功德，生者自利。以是之故，未來現在善男女等，聞健自修，分分己獲。無常大鬼，不期而到，冥冥遊神，未知罪福。七七日內，如癡如聾，或在諸司辯論業果。審定之後，據業受生。未測之間，千萬愁苦，何況墮於諸惡趣等。
是命終人，未得受生，在七七日內，念念之間，望諸骨肉眷屬，與造福力救拔。過是日後，隨業受報。若是罪人，動經千百歲中，無解脫日。若是五無間罪，墮大地獄，千劫萬劫，永受眾苦。
復次長者：如是罪業眾生，命終之後，眷屬骨肉，為修營齋，資助業道未齋食竟，及營齋之次，米泔菜葉，不棄於地，乃至諸食未獻佛僧，勿得先食。如有違食，及不精勤，是命終人，了不得力。如精勤護淨奉獻佛僧，是命終人，七分獲一。是故長者，閻浮眾生，若能為其父母乃至眷屬，命終之後，設齋供養，志心勤懇。如是之人，存亡獲利。
說是語時，忉利天宮，有千萬億那由他閻浮鬼神，悉發無量菩提之心，大辯長者作禮而退
### 08 閻羅王眾讚歎品第八
爾時鐵圍山內，有無量鬼王，與閻羅天子，俱詣忉利，來到佛所。所謂：惡毒鬼王、多惡鬼王、大諍鬼王、白虎鬼王、血虎鬼王、赤虎鬼王、散殃鬼王、飛身鬼王、電光鬼王、狼牙鬼王、千眼鬼王、噉獸鬼王、負石鬼王、主耗鬼王、主禍鬼王、主食鬼王、主財鬼王、主畜鬼王、主禽鬼王、主獸鬼王、主魅鬼王、主產鬼王、主命鬼王、主疾鬼王、主險鬼王、三目鬼王、四目鬼王、五目鬼王、祁利失王、大祁利失王、祁利叉王、大祁利叉王、阿那吒王、大阿那吒王、如是等大鬼王，各各與百千諸小鬼王，盡居閻浮提，各有所執，各有所主。是諸鬼王與閻羅天子，承佛威神，及地藏菩薩摩訶薩力，俱詣忉利，在一面立。
爾時閻羅天子，胡跪合掌白佛言：世尊，我等今者與諸鬼王，承佛威神，及地藏菩薩摩訶薩力，方得詣此忉利大會，亦是我等獲善利故。我今有小疑事，敢問世尊。唯願世尊慈悲宣說。
佛告閻羅天子：恣汝所問，吾為汝說。
是時閻羅天子瞻禮世尊，及迴視地藏菩薩，而白佛言：世尊，我觀地藏菩薩在六道中，百千方便而度罪苦眾生，不辭疲倦，是大菩薩有如是不可思議神通之事。然諸眾生獲脫罪報，未久之間，又墮惡道。世尊，是地藏菩薩既有如是不可思議神力，云何眾生而不依止善道，永取解脫？唯願世尊為我解說。
佛告閻羅天子：南閻浮提眾生，其性剛強，難調難伏。是大菩薩，於百千劫，頭頭救拔如是眾生，早令解脫。是罪報人乃至墮大惡趣，菩薩以方便力，拔出根本業緣，而遣悟宿世之事。自是閻浮提眾生結惡習重，旋出旋入，勞斯菩薩久經劫數而作度脫。
譬如有人迷失本家，誤入險道，其險道中，多諸夜叉、及虎狼獅子、蚖蛇蝮蠍。如是迷人，在險道中，須臾之間，即遭諸毒。有一知識，多解大術，善禁是毒，乃及夜叉諸惡毒等。忽逢迷人欲進險道，而語之言：咄哉男子，為何事故而入此路，有何異術，能制諸毒。是迷路人忽聞是語，方知險道，即便退步，求出此路。是善知識，提攜接手，引出險道，免諸惡毒。
至於好道，令得安樂。而語之言：咄哉迷人，自今已後，勿履是道。此路入者，卒難得出，復損性命。是迷路人亦生感重。臨別之時，知識又言：若見親知及諸路人，若男若女，言於此路多諸毒惡，喪失性命。無令是眾自取其死。
是故地藏菩薩俱大慈悲，救拔罪苦眾生，生人天中，令受妙樂。是諸罪眾，知業道苦，脫得出離，永不再歷。如迷路人，誤入險道，遇善知識引接令出，永不復入。逢見他人，復勸莫入。自言因是迷故，得解脫竟，更不復入。若再履踐，猶尚迷誤，不覺舊曾所落險道，或致失命。如墮惡趣，地藏菩薩方便力故，使令解脫，生人天中。旋又再入，若業結重，永處地獄，無解脫時。
爾時惡毒鬼王合掌恭敬白佛言：世尊，我等諸鬼王，其數無量，在閻浮提，或利益人，或損害人，各各不同。然是業報，使我眷屬遊行世界，多惡少善。過人家庭，或城邑聚落，莊園房舍。或有男子女人，修毛髮善事，乃至懸一旛一蓋，少香少華，供養佛像及菩薩像。或轉讀尊經，燒香供養一句一偈。我等鬼王敬禮是人，如過去現在未來諸佛。敕諸小鬼，各有大力，及土地分，便令衛護，不令惡事橫事、惡病橫病，乃至不如意事，近於此舍等處，何況入門。
佛讚鬼王：善哉，善哉！汝等及與閻羅，能如是擁護善男女等，吾亦告梵王帝釋，令衛護汝。
說是語時，會中有一鬼王，名曰主命。白佛言：世尊，我本業緣，主閻浮人命，生時死時，我皆主之。在我本願，甚欲利益。自是眾生不會我意，致令生死俱不得安。何以故。是閻浮提人初生之時，不問男女，或欲生時，但作善事，增益宅舍，自令土地無量歡喜，擁護子母，得大安樂，利益眷屬。或已生下，慎勿殺害，取諸鮮味供給產母，及廣聚眷屬，飲酒食肉，歌樂絃管，能令子母不得安樂。
何以故。是產難時，有無數惡鬼及魍魎精魅，欲食腥血。是我早令舍宅土地靈祇。荷護子母，使令安樂，而得利益。如是之人，見安樂故，便合設福，答諸土地。翻為殺害，聚集眷屬。以是之故，犯殃自受，子母俱損。
又閻浮提臨命終人，不問善惡，我欲令是命終之人，不落惡道。何況自修善根增我力故。是閻浮提行善之人，臨命終時，亦有百千惡道鬼神，或變作父母，乃至諸眷屬，引接亡人，令落惡道。何況本造惡者。
世尊，如是閻浮提男子女人臨命終時，神識惛昧，不辨善惡，乃至眼耳更無見聞。是諸眷屬，當須設大供養，轉讀尊經，念佛菩薩名號。如是善緣，能令亡者離諸惡道，諸魔鬼神悉皆退散。
世尊，一切眾生臨命終時，若得聞一佛名，一菩薩名，或大乘經典，一句一偈。我觀如是輩人，除五無間殺害之罪，小小惡業，合墮惡趣者，尋即解脫。
佛告主命鬼王：汝大慈故，能發如是大願，於生死中，護諸眾生。若未來世中，有男子女人至生死時，汝莫退是願，總令解脫，永得安樂。
鬼王白佛言：願不有慮。我畢是形，念念擁護閻浮眾生，生時死時，俱得安樂。但願諸眾生於生死時，信受我語，無不解脫，獲大利益。
爾時佛告地藏菩薩：是大鬼王主命者，已曾經百千生，作大鬼王，於生死中，擁護眾生。是大士慈悲願故，現大鬼身，實非鬼也。卻後過一百七十劫，當得成佛，號曰無相如來，劫名安樂，世界名淨住，其佛壽命不可計劫。地藏，是大鬼王，其事如是不可思議，所度人天亦不可限量。
### 09 稱佛名號品第九
爾時地藏菩薩摩訶薩白佛言：世尊，我今為未來眾生演利益事，於生死中，得大利益，唯願世尊聽我說之。
佛告地藏菩薩：汝今欲興慈悲，救拔一切罪苦六道眾生，演不思議事，今正是時，唯當速說。吾即涅槃，使汝早畢是願，吾亦無憂現在未來一切眾生。
地藏菩薩白佛言：世尊，過去無量阿僧祇劫，有佛出世，號無邊身如來。若有男子女人聞是佛名，暫生恭敬，即得超越四十劫生死重罪。何況塑畫形像，供養讚歎，其人獲福無量無邊。
又於過去恆河沙劫，有佛出世，號寶性如來。若有男子女人聞是佛名，一彈指頃，發心歸依，是人於無上道永不退轉。
又於過去有佛出世，號波頭摩勝如來。若有男子、女人，聞是佛名，歷於耳根，是人當得千返生於六欲天中，何況志心稱念。
又於過去，不可說不可說阿僧祇劫，有佛出世，號師子吼如來。若有男子女人聞是佛名，一念歸依，是人得遇無量諸佛摩頂授記。
又於過去有佛出世，號拘留孫佛。若有男子女人，聞是佛名，志心瞻禮或復讚歎，是人於賢劫千佛會中，為大梵王，得授上記。
又於過去有佛出世，號毘婆尸佛。若有男子女人聞是佛名，永不墮惡道，常生人天，受勝妙樂。
又於過去無量無數恆河沙劫，有佛出世，號寶勝如來。若有男子女人聞是佛名，畢竟不墮惡道，常在天上受勝妙樂。
又於過去有佛出世，號寶相如來。若有男子女人聞是佛名，生恭敬心，是人不久得阿羅漢果。
又於過去無量阿僧祇劫，有佛出世，號袈裟幢如來。若有男子女人聞是佛名者，超一百大劫生死之罪。
又於過去有佛出世，號大通山王如來。若有男子女人聞是佛名者，是人得遇恆河沙佛廣為說法，必成菩提。
又於過去有淨月佛、山王佛、智勝佛、淨名王佛、智成就佛、無上佛、妙聲佛、滿月佛、月面佛有如是等不可說佛。世尊，現在未來一切眾生，若天若人，若男若女，但念得一佛名號，功德無量，何況多名。
是眾生等，生時死時，自得大利，終不墮惡道。若有臨命終人，家中眷屬，乃至一人，為是病人高聲念一佛名，是命終人，除五無間罪，餘業報等悉得銷滅。是五無間罪，雖至極重，動經億劫，了不得出，承斯臨命終時，他人為其稱念佛名，於是罪中，亦漸銷滅。何況眾生自稱自念，獲福無量，滅無量罪。
### 10 校量布施功德緣品第十
爾時地藏菩薩摩訶薩，承佛威神，從座而起，胡跪合掌白佛言：世尊，我觀業道眾生，校量布施，有輕有重，有一生受福，有十生受福，有百生千生受大福利者。是事云何，唯願世尊為我說之。
爾時佛告地藏菩薩：吾今於忉利天宮一切眾會，說閻浮提布施較量功德輕重，汝當諦聽，吾為汝說。
地藏白佛言：我疑是事，願樂欲聞。
佛告地藏菩薩：南閻浮提，有諸國王、宰輔大臣、大長者、大剎利、大婆羅門等，若遇最下貧窮，乃至癃殘瘖啞，聾癡無目，如是種種不完具者。是大國王等欲布施時，若能具大慈悲下心含笑，親手遍布施，或使人施，軟言慰喻，是國王等所獲福利，如布施百恆河沙佛功德之利。何以故。緣是國王等，於是最貧賤輩及不完具者，發大慈心，是故福利有如此報。百千生中，常得七寶具足，何況衣食受用。
復次地藏：若未來世，有諸國王，至婆羅門等，遇佛塔寺，或佛形像，乃至菩薩聲聞辟支佛像，躬自營辦供養布施。是國王等，當得三劫為帝釋身，受勝妙樂。若能以此布施福利，迴向法界，是大國王等，於十劫中，常為大梵天王。
復次地藏：若未來世，有諸國王，至婆羅門等，遇先佛塔廟，或至經像，毀壞破落，乃能發心修補。是國王等，或自營辦，或勸他人，乃至百千人等布施結緣。是國王等，百千生中常為轉輪王身。如是他人同布施者，百千生中常為小國王身。更能於塔廟前，發迴向心。如是國王乃及諸人，盡成佛道，以此果報無量無邊。
復次地藏：未來世中，有諸國王及婆羅門等，見諸老病及生產婦女，若一念間，具大慈心，布施醫藥飲食臥具，使令安樂。如是福利最不思議，一百劫中常為淨居天主，二百劫中常為六欲天主，畢竟成佛，永不墮惡道，乃至百千生中，耳不聞苦聲。
復次地藏：若未來世中，有諸國王及婆羅門等，能作如是布施，獲福無量。更能迴向，不問多少，畢竟成佛，何況釋梵轉輪之報。是故地藏，普勸眾生當如是學。
復次地藏：未來世中，若善男子善女人，於佛法中，種少善根，毛髮沙塵等許，所受福利，不可為喻。
復次地藏：未來世中，若有善男子善女人，遇佛形像、菩薩形像、辟支佛形像、轉輪王形像，布施供養得無量福，常在人天受勝妙樂。若能迴向法界，是人福利不可為喻。
復次地藏：未來世中，若有善男子善女人，遇大乘經典，或聽聞一偈一句，發殷重心，讚歎恭敬，布施供養。是人獲大果報，無量無邊。若能迴向法界，其福不可為喻。
復次地藏：若未來世中，有善男子善女人，遇佛塔寺，大乘經典。新者布施供養，瞻禮讚歎，恭敬合掌。若遇故者，或毀壞者，修補營理，或獨發心，或勸多人同共發心。如是等輩，三十生中常為諸小國王，檀越之人，常為輪王，還以善法教化諸小國王。
復次地藏：未來世中，若有善男子善女人，於佛法中所種善根，或布施供養，或修補塔寺，或裝理經典，乃至一毛一塵，一沙一渧。如是善事，但能迴向法界，是人功德，百千生中受上妙樂。如但迴向自家眷屬，或自身利益，如是之果，即三生受樂，捨一得萬報。是故地藏，布施因緣，其事如是。
### 11 地神護法品第十一
爾時堅牢地神白佛言：世尊，我從昔來瞻視頂禮無量菩薩摩訶薩，皆是大不可思議神通智慧，廣度眾生。是地藏菩薩摩訶薩，於諸菩薩誓願深重，世尊，是地藏菩薩於閻浮提有大因緣。如文殊、普賢、觀音、彌勒，亦化百千身形，度於六道，其願尚有畢竟。是地藏菩薩教化六道一切眾生，所發誓願劫數，如千百億恆河沙。
世尊，我觀未來及現在眾生，於所住處，於南方清潔之地，以土石竹木作其龕室，是中能塑畫，乃至金銀銅鐵，作地藏形像，燒香供養，瞻禮讚歎。是人居處，即得十種利益。何等為十：
一者、土地豐壤；二者、家宅永安；三者、先亡生天；四者、現存益壽；五者、所求遂意；六者、無水火災；七者、虛耗辟除；八者、杜絕惡夢；九者、出入神護；十者、多遇聖因。
世尊，未來世中，及現在眾生，若能於所住處方面，作如是供養，得如是利益。
復白佛言：世尊，未來世中，若有善男子善女人，於所住處，有此經典及菩薩像，是人更能轉讀經典，供養菩薩。我常日夜以本神力，衛護是人，乃至水火盜賊，大橫小橫，一切惡事，悉皆消滅。
佛告堅牢地神：汝大神力，諸神少及。何以故？閻浮土地，悉蒙汝護，乃至草木沙石，稻麻竹葦，穀米寶貝，從地而有，皆因汝力。又常稱揚地藏菩薩利益之事。汝之功德，及以神通，百千倍於常分地神。若未來世中，有善男子善女人，供養菩薩，及轉讀是經，但依地藏本願經一事修行者。汝以本神力而擁護之，勿令一切災害及不如意事，輒聞於耳，何況令受。非但汝獨護是人故，亦有釋梵眷屬，諸天眷屬，擁護是人。何故得如是聖賢擁護，皆由瞻禮地藏形像，及轉讀是本願經故，自然畢竟出離苦海，證涅槃樂。以是之故，得大擁護。
### 12 見聞利益品第十二
爾時世尊，從頂門上，放百千萬億大毫相光，所謂：白毫相光、大白毫相光、瑞毫相光、大瑞毫相光、玉毫相光、大玉毫相光、紫毫相光、大紫毫相光、青毫相光、大青毫相光、碧毫相光、大碧毫相光、紅毫相光、大紅毫相光、綠毫相光、大綠毫相光、金毫相光、大金毫相光、慶雲毫相光、大慶雲毫相光、千輪毫光、大千輪毫光、寶輪毫光、大寶輪毫光、日輪毫光、大日輪毫光、月輪毫光、大月輪毫光、宮殿毫光、大宮殿毫光、海雲毫光、大海雲毫光。
於頂門上放如是等毫相光已，出微妙音，告諸大眾，天龍八部、人非人等：聽吾今日於忉利天宮，稱揚讚歎地藏菩薩於人天中，利益等事、不思議事、超聖因事、證十地事、畢竟不退阿耨多羅三藐三菩提事。
說是語時，會中有一菩薩摩訶薩，名觀世音，從座而起，胡跪合掌白佛言：世尊，是地藏菩薩摩訶薩具大慈悲，憐愍罪苦眾生，於千萬億世界，化千萬億身。所有功德及不思議威神之力。我聞世尊，與十方無量諸佛，異口同音，讚歎地藏菩薩云：正使過去現在未來諸佛，說其功德，猶不能盡。向者，又蒙世尊，普告大眾：欲稱揚地藏利益等事。唯願世尊，為現在未來一切眾生，稱揚地藏不思議事，令天龍八部，瞻禮獲福。
佛告觀世音菩薩：汝於娑婆世界有大因緣。若天若龍、若男若女、若神若鬼、乃至六道罪苦眾生，聞汝名者、見汝形者、戀慕汝者、讚歎汝者。是諸眾生，於無上道，必不退轉。常生人天，具受妙樂。因果將熟，遇佛受記。汝今具大慈悲，憐愍眾生，及天龍八部，聽吾宣說地藏菩薩不思議利益之事。汝當諦聽，吾今說之。
觀世音言：唯然，世尊，願樂欲聞！
佛告觀世音菩薩：未來現在諸世界中，有天人受天福盡，有五衰相現，或有墮於惡道之者。如是天人，若男若女，當現相時，或見地藏菩薩形像、或聞地藏菩薩名，一瞻一禮。是諸天人，轉增天福，受大快樂，永不墮三惡道報。何況見聞菩薩，以諸香華、衣服、飲食、寶貝、瓔珞，布施供養，所獲功德福利，無量無邊。
復次觀世音：若未來現在諸世界中，六道眾生臨命終時，得聞地藏菩薩名，一聲歷耳根者。是諸眾生，永不歷三惡道苦。何況臨命終時，父母眷屬，將是命終人舍宅、財物、寶貝、衣服，塑畫地藏形像。或使病人未終之時，眼耳見聞，知道眷屬將舍宅、寶貝等為其自身塑畫地藏菩薩形像。是人若是業報合受重病者，承斯功德，尋即除愈，壽命增益。是人若是業報命盡，應有一切罪障業障，合墮惡趣者。承斯功德，命終之後，即生人天，受勝妙樂，一切罪障，皆悉消滅。
復次觀世音菩薩：若未來世，有男子女人，或乳哺時、或三歲、五歲、十歲以下，亡失父母，乃及亡失兄弟姐妹，是人年既長大，思憶父母及諸眷屬，不知落在何趣、生何世界、生何天中？是人若能塑畫地藏菩薩形像，乃至聞名，一瞻一禮，一日至七日，莫退初心，聞名見形，瞻禮供養。是人眷屬，假因業故，墮惡趣者，計當劫數，承斯男女，兄弟姊妹，塑畫地藏形像，瞻禮功德，尋即解脫，生人天中，受勝妙樂。是人眷屬，如有福力，已生人天，受勝妙樂者，即承斯功德，轉增聖因，受無量樂。
是人更能三七日中，一心瞻禮地藏形像，念其名字，滿於萬遍。當得菩薩現無邊身，具告是人，眷屬生界。或於夢中，菩薩現大神力，親領是人，於諸世界，見諸眷屬。更能每日念菩薩名千遍，至於千日。是人當得菩薩遣所在土地鬼神，終身衛護，現世衣食豐溢，無諸疾苦。乃至橫事不入其門，何況及身。是人畢竟得菩薩摩頂授記。
復次觀世音菩薩：若未來世有善男子善女人，欲發廣大慈心，救度一切眾生者，欲修無上菩提者，欲出離三界者。是諸人等，見地藏形像，及聞名者，至心歸依，或以香華、衣服、寶貝、飲食，供養瞻禮。是善男女等，所願速成，永無障礙。
復次觀世音：若未來世，有善男子善女人，欲求現在未來百千萬億等願，百千萬億等事。但當歸依瞻禮、供養讚歎，地藏菩薩形像。如是所願所求，悉皆成就。復願地藏菩薩具大慈悲，永擁護我。是人於睡夢中，即得菩薩摩頂授記。
復次觀世音菩薩：若未來世，善男子善女人，於大乘經典，深生珍重，發不思議心，欲讀欲誦。縱遇明師教視令熟，旋得旋忘，動經年月，不能讀誦。是善男子等，有宿業障，未得消除，故於大乘經典，無讀誦性。如是之人，聞地藏菩薩名、見地藏菩薩像，具以本心恭敬陳白，更以香華、衣服、飲食、一切玩具，供養菩薩。以淨水一盞，經一日一夜安菩薩前，然後合掌請服，回首向南。臨入口時，至心鄭重，服水既畢，慎五辛酒肉，邪婬妄語，及諸殺害，一七日或三七日。是善男子善女人，於睡夢中，具見地藏菩薩現無邊身，於是人處，授灌頂水。其人夢覺，即獲聰明，應是經典，一歷耳根，即當永記，更不忘失一句一偈。
復次觀世音菩薩：若未來世，有諸人等，衣食不足，求者乖願、或多病疾、或多凶衰、家宅不安、眷屬分散、或諸橫事，多來忤身，睡夢之間，多有驚怖。如是人等，聞地藏名、見地藏形，至心恭敬，念滿萬遍。是諸不如意事，漸漸消滅，即得安樂、衣食豐益，乃至於睡夢中，悉皆安樂。
復次觀世音菩薩：若未來世，有善男子善女人，或因治生、或因公私、或因生死、或因急事，入山林中、過渡河海、乃及大水、或經險道。是人先當念地藏菩薩名萬遍，所過土地，鬼神衛護，行住坐臥，永保安樂。乃至逢於虎狼師子，一切毒害，不能損之。
佛告觀世音菩薩：是地藏菩薩，於閻浮提有大因緣，若說於諸眾生見聞利益等事，百千劫中，說不能盡。是故觀世音，汝以神力流布是經，令娑婆世界眾生，百千萬劫永受安樂。
爾時世尊，而說偈言：
吾觀地藏威神力，恆河沙劫說難盡，見聞瞻禮一念間，利益人天無量事。
若男若女若龍神，報盡應當墮惡道，至心歸依大士身，壽命轉增除罪障。
少失父母恩愛者，未知魂神在何趣，兄弟姊妹及諸親，生長以來皆不識。
或塑或畫大士身，悲戀瞻禮不暫捨，三七日中念其名，菩薩當現無邊體，
示其眷屬所生界，縱墮惡趣尋出離。若能不退是初心，即獲摩頂受聖記。
欲修無上菩提者，乃至出離三界苦。是人既發大悲心，先當瞻禮大士像，
一切諸願速成就，永無業障能遮止。有人發心念經典，欲度群迷超彼岸，
雖立是願不思議，旋讀旋忘多廢失，斯人有業障惑故，於大乘經不能記。
供養地藏以香華，衣服飲食諸玩具，以淨水安大士前，一日一夜求服之，
發殷重心慎五辛，酒肉邪婬及妄語，三七日內勿殺害，至心思念大士名，
即於夢中見無邊，覺來便得利根耳，應是經教歷耳聞，千萬生中永不忘。
以是大士不思議，能使斯人獲此慧。貧窮眾生及疾病，家宅凶衰眷屬離。
睡夢之中悉不安，求者乖違無稱遂。至心瞻禮地藏像，一切惡事皆消滅。
至於夢中盡得安，衣食豐饒神鬼護。欲入山林及渡海，毒惡禽獸及惡人，
惡神惡鬼并惡風，一切諸難諸苦惱。但當瞻禮及供養，地藏菩薩大士像，
如是山林大海中，應是諸惡皆消滅。觀音至心聽吾說，地藏無盡不思議，
百千萬劫說不周，廣宣大士如是力。地藏名字人若聞，乃至見像瞻禮者，
香華衣服飲食奉，供養百千受妙樂。若能以此迴法界，畢竟成佛超生死。
是故觀音汝當知，普告恆沙諸國土。
### 13 囑累人天品第十三
爾時世尊舉金色臂，又摩地藏菩薩摩訶薩頂，而作是言：地藏地藏，汝之神力不可思議、汝之慈悲不可思議、汝之智慧不可思議、汝之辯才不可思議，正使十方諸佛，讚歎宣說汝之不思議事，千萬劫中，不能得盡。
地藏地藏，記吾今日在忉利天中，於百千萬億不可說，不可說，一切諸佛菩薩，天龍八部，大會之中，再以人天諸眾生等，未出三界，在火宅中者，付囑於汝。無令是諸眾生，墮惡趣中，一日一夜，何況更落五無間，及阿鼻地獄，動經千萬億劫，無有出期。
地藏，是南閻浮提眾生，志性無定，習惡者多。縱發善心，須臾即退。若遇惡緣，念念增長。以是之故，吾分是形，百千億化度，隨其根性而度脫之。
地藏，吾今殷勤，以天人眾，付囑於汝。未來之世，若有天人，及善男子善女人，於佛法中，種少善根，一毛一塵，一沙一渧，汝以道力，擁護是人，漸修無上，勿令退失。
復次地藏，未來世中，若天若人，隨業報應，落在惡趣。臨墮趣中，或至門首，是諸眾生，若能念得一佛名，一菩薩名，一句一偈大乘經典。是諸眾生，汝以神力，方便救拔，於是人所，現無邊身，為碎地獄，遣令生天，受勝妙樂。
爾時世尊，而說偈言：
現在未來天人眾，吾今慇懃付囑汝，以大神通方便度，勿令墮在諸惡趣。
爾時地藏菩薩摩訶薩，胡跪合掌白佛言：世尊，唯願世尊不以為慮。未來世中，若有善男子善女人，於佛法中，一念恭敬，我亦百千方便，度脫是人，於生死中速得解脫。何況聞諸善事，念念修行，自然於無上道永不退轉。
說是語時，會中有一菩薩，名虛空藏，白佛言：世尊，我自至忉利，聞於如來讚歎地藏菩薩，威神勢力，不可思議。未來世中，若有善男子善女人，乃及一切天龍，聞此經典及地藏名字，或瞻禮形像，得幾種福利？唯願世尊，為未來現在一切眾等，略而說之。
佛告虛空藏菩薩：諦聽諦聽！吾當為汝分別說之。若未來世，有善男子善女人，見地藏形像，及聞此經，乃至讀誦，香華飲食，衣服珍寶，布施供養，讚歎瞻禮，得二十八種利益：一者、天龍護念，二者、善果日增，三者、集聖上因，四者、菩提不退，五者、衣食豐足，六者、疾疫不臨，七者、離水火災，八者、無盜賊厄，九者、人見欽敬，十者、神鬼助持，十一者、女轉男身，十二者、為王臣女，十三者、端正相好，十四者、多生天上。十五者、或為帝王，十六者、宿智命通，十七者、有求皆從，十八者、眷屬歡樂，十九者、諸橫消滅，二十者、業道永除，二十一者、去處盡通，二十二者、夜夢安樂，二十三者、先亡離苦，二十四者、宿福受生，二十五者、諸聖讚歎，二十六者、聰明利根，二十七者、饒慈愍心，二十八者、畢竟成佛。
復次虛空藏菩薩：若現在未來，天龍鬼神，聞地藏名，禮地藏形，或聞地藏本願事行，讚歎瞻禮，得七種利益：
一者、速超聖地，二者、惡業消滅，三者、諸佛護臨，四者、菩提不退，五者、增長本力，六者、宿命皆通，七者、畢竟成佛。
爾時，十方一切諸來，不可說不可說諸佛如來，及大菩薩天龍八部，聞釋迦牟尼佛，稱揚讚歎地藏菩薩，大威神力，不可思議，歎未曾有。
是時，忉利天，雨無量香華，天衣珠瓔，供養釋迦牟尼佛，及地藏菩薩已，一切眾會，俱復瞻禮，合掌而退。

願以此功德    莊嚴佛淨土
上報四重恩    下濟三塗苦
若有見聞者    悉發菩提心
盡此一報身    同生極樂國

## 前行
### 讚佛
法王無上尊，三界無倫匹。
天人之導師，四生之慈父。
於一念歸依，能滅三祇業。
稱揚若讚歎，億劫莫能盡。
### 觀想
能禮所禮性空寂，感應道交難思議。
我此道場如帝珠，十方諸佛影現中。
我身影現諸佛前，頭面接足歸命禮。
### 頂禮
至心頂禮：南無盡虛空遍法界過去現在未來十方諸佛、尊法、賢聖僧，常住三寶。
至心頂禮：南無娑婆教主調御本師釋迦牟尼佛、當來下生彌勒尊佛、大智文殊師利菩薩、大行普賢菩薩、護法諸尊菩薩、靈山會上佛菩薩。
至心頂禮：南無西方極樂世界大慈大悲阿彌陀佛、大悲觀世音菩薩、大勢至菩薩、大願地藏王菩薩、清淨大海眾菩薩。
### 楞嚴咒讚
南無楞嚴會上佛菩薩（三稱）
妙湛總持不動尊, 首楞嚴王世稀有.
銷我億劫顛倒想, 不歷僧祇獲法身.
願今得果成寶王, 還度如是恆沙眾.
將此深心奉塵剎, 是則名為報佛恩.
伏請世尊為證明, 五濁惡世誓先入.

南無常住十方僧, 南無釋迦牟尼佛.

爾時世尊, 從肉髻中.
涌百寶光, 光中涌出.
千葉寶蓮, 有化如來.
坐寶華中, 頂放十道.
百寶光明, 一一光明.
皆遍示現, 十恆河沙.
金剛密跡, 擎山持杵.
遍虛空界, 大眾仰觀.
畏愛兼抱, 求佛哀祐.
一心聽佛, 無見頂相.
放光如來, 宣說神咒.

## 摩訶般若波羅蜜多心經
觀自在菩薩，行深般若波羅蜜多時，照見五蘊皆空，度一切苦厄。
舍利子！
色不異空，空不異色；色即是空，空即是色；受、想、行、識，亦復如是。
舍利子！
是諸法空相，不生、不滅，不垢、不淨，不增、不減。
是故空中無色，無受、想、行、識；無眼、耳、鼻、舌、身、意；無色、聲、香、味、觸、法；無眼界，乃至無意識界；無無明，亦無無明盡；乃至無老死，亦無老死盡。
無苦、集、滅、道；無智亦無得。
以無所得故，菩提薩埵依般若波羅蜜多故，心無罣礙；無罣礙故，無有恐怖，遠離顛倒夢想，究竟涅槃。
三世諸佛，依般若波羅蜜多故，得阿耨多羅三藐三菩提。
故知般若波羅蜜多，是大神咒，是大明咒，是無上咒，是無等等咒，能除一切苦，真實不虛。
故說般若波羅蜜多咒。

揭諦　揭諦　波羅揭諦　波羅僧揭諦　菩提薩婆訶。

</script>
<script>
(async () => {
  "use strict";

  const STORAGE_KEY = "ri_zong_reader_v1";
  const $ = id => document.getElementById(id);
  const items = [];
  const volumes = [];
  let proseBuffer = "";
  let currentVolume = null;

  function addSentence(text, annotation = "") {
    const clean = text.replace(/\s+/g, " ").trim();
    if (clean && currentVolume) {
      items.push({ text: clean, annotation, volume: currentVolume.number });
    }
  }

  function flushCompleteSentences(final = false) {
    const ending = /[。！？!?；;.]/;
    while (proseBuffer) {
      let end = -1;
      for (let i = 0; i < proseBuffer.length; i += 1) {
        if (ending.test(proseBuffer[i])) {
          end = i;
          break;
        }
      }
      if (end < 0) break;
      addSentence(proseBuffer.slice(0, end + 1));
      proseBuffer = proseBuffer.slice(end + 1).trim();
    }
    if (final && proseBuffer.trim()) {
      addSentence(proseBuffer);
      proseBuffer = "";
    }
  }

  function finishVolume() {
    flushCompleteSentences(true);
    if (!currentVolume) return;
    if (currentVolume.start < items.length) currentVolume.end = items.length - 1;
    else volumes.pop();
    currentVolume = null;
  }

  function startVolume(name) {
    finishVolume();
    currentVolume = {
      number: volumes.length + 1,
      name,
      start: items.length,
      end: items.length
    };
    volumes.push(currentVolume);
  }

  let majorHeading = "";
  const sourceLines = $("riZongSource").textContent.split(/\r?\n/);
  sourceLines.forEach(rawLine => {
    const line = rawLine.trim();
    if (!line) return;
    const major = line.match(/^##\s+(.+)$/);
    if (major) {
      finishVolume();
      majorHeading = major[1].trim();
      return;
    }
    const heading = line.match(/^###\s+(.+)$/);
    if (heading) {
      startVolume(majorHeading ? `${majorHeading} · ${heading[1].trim()}` : heading[1].trim());
      return;
    }
    if (!currentVolume) startVolume(majorHeading || "日誦");
    const annotation = line.match(/^(.*?)(?:\s*#\s*)(.+)$/);
    if (annotation) {
      flushCompleteSentences(true);
      addSentence(annotation[1].replace(/^\d+[.、]\s*/, ""), annotation[2].trim());
      return;
    }
    if (/[咒陀羅尼真言]/.test(currentVolume.name) && !/[。！？!?；;.]/.test(line)) {
      flushCompleteSentences(true);
      addSentence(line.replace(/^\d+[.、]\s*/, ""));
      return;
    }
    if (/\s{2,}/.test(rawLine)) {
      flushCompleteSentences(true);
      rawLine.trim().split(/\s{2,}/).forEach(addSentence);
    } else {
      proseBuffer += line;
      flushCompleteSentences(false);
    }
  });
  finishVolume();

  if (!items.length || !volumes.length) {
    $("sentence").textContent = "無法讀取經文內容。";
    document.querySelectorAll("button, select").forEach(element => { element.disabled = true; });
    return;
  }

  const todayKey = () => {
    const date = new Date();
    return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
  };
  const defaultState = () => ({
    version: 1,
    current: 0,
    start: 0,
    sessionCount: 0,
    totalCount: 0,
    daily: {},
    finished: false,
    fontSize: 44,
    notes: []
  });
  const validIndex = value => Number.isInteger(value) && value >= 0 && value < items.length;
  const validState = value => value &&
    value.version === 1 &&
    validIndex(value.current) &&
    validIndex(value.start) &&
    value.current >= value.start &&
    Number.isInteger(value.sessionCount) && value.sessionCount >= 0 &&
    Number.isInteger(value.totalCount) && value.totalCount >= 0 &&
    value.daily && typeof value.daily === "object" &&
    typeof value.finished === "boolean" &&
    Number.isInteger(value.fontSize) && value.fontSize >= 30 && value.fontSize <= 72 &&
    (!("notes" in value) || Array.isArray(value.notes));

  function normalizeState(value) {
    if (!Array.isArray(value.notes)) value.notes = [];
    return value;
  }

  let state = defaultState();
  let databasePromise = null;
  let saveQueue = Promise.resolve();

  function openDatabase() {
    if (databasePromise) return databasePromise;
    databasePromise = new Promise((resolve, reject) => {
      if (!("indexedDB" in window)) {
        reject(new Error("IndexedDB unavailable"));
        return;
      }
      const request = indexedDB.open("di_zang_jing_reader", 1);
      request.onupgradeneeded = () => {
        if (!request.result.objectStoreNames.contains("progress")) {
          request.result.createObjectStore("progress");
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("IndexedDB failed"));
      request.onblocked = () => reject(new Error("IndexedDB blocked"));
    });
    return databasePromise;
  }

  async function readDatabase() {
    const database = await openDatabase();
    return new Promise((resolve, reject) => {
      const transaction = database.transaction("progress", "readonly");
      const request = transaction.objectStore("progress").get(STORAGE_KEY);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error || new Error("Read failed"));
    });
  }

  async function writeDatabase(snapshot) {
    const database = await openDatabase();
    return new Promise((resolve, reject) => {
      const transaction = database.transaction("progress", "readwrite");
      transaction.objectStore("progress").put(snapshot, STORAGE_KEY);
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error || new Error("Write failed"));
      transaction.onabort = () => reject(transaction.error || new Error("Write aborted"));
    });
  }

  function parseSavedState(raw) {
    if (typeof raw !== "string" || !raw) return null;
    try {
      const parsed = JSON.parse(raw);
      return validState(parsed) ? parsed : null;
    } catch {
      return null;
    }
  }

  async function loadSavedState() {
    const candidates = [];
    try {
      const local = parseSavedState(localStorage.getItem(STORAGE_KEY));
      if (local) candidates.push(local);
    } catch {
      // Textastic 的 WKWebView 有時不允許本機預覽使用 localStorage。
    }
    try {
      const database = parseSavedState(await readDatabase());
      if (database) candidates.push(database);
    } catch {
      // IndexedDB 不可用時仍可繼續嘗試 localStorage。
    }
    if (candidates.length) {
      candidates.sort((a, b) =>
        (Date.parse(b.updatedAt || "") || 0) -
        (Date.parse(a.updatedAt || "") || 0)
      );
      state = normalizeState(candidates[0]);
      $("saveStatus").textContent = "已恢復進度";
    }
  }

  async function writeSnapshot(snapshot) {
    let saved = false;
    try {
      localStorage.setItem(STORAGE_KEY, snapshot);
      saved = true;
    } catch {
      // 改用 IndexedDB。
    }
    try {
      await writeDatabase(snapshot);
      saved = true;
    } catch {
      // 若兩種儲存方式皆失敗，顯示備份提示。
    }
    if (saved) {
      $("saveStatus").textContent = "已儲存";
      if ($("notice").textContent.includes("無法自動儲存")) {
        $("notice").textContent = "";
      }
    } else {
      $("saveStatus").textContent = "尚未儲存";
      $("notice").textContent = "無法自動儲存；請使用「匯出進度」備份。";
    }
  }

  function save() {
    state.updatedAt = new Date().toISOString();
    const snapshot = JSON.stringify(state);
    $("saveStatus").textContent = "儲存中…";
    saveQueue = saveQueue.then(
      () => writeSnapshot(snapshot),
      () => writeSnapshot(snapshot)
    );
    return saveQueue;
  }

  await loadSavedState();

  let searchQuery = "";
  let searchMatches = [];
  let searchCursor = -1;
  let editingNoteId = null;

  function volumeFor(index) {
    return volumes.find(volume => index >= volume.start && index <= volume.end) || volumes[0];
  }

  function showHighlightedSentence(element, text) {
    element.replaceChildren();
    if (!searchQuery || !text.includes(searchQuery)) {
      element.textContent = text;
      return;
    }
    let start = 0;
    let match = text.indexOf(searchQuery, start);
    while (match >= 0) {
      element.append(document.createTextNode(text.slice(start, match)));
      const highlight = document.createElement("mark");
      highlight.textContent = searchQuery;
      element.append(highlight);
      start = match + searchQuery.length;
      match = text.indexOf(searchQuery, start);
    }
    element.append(document.createTextNode(text.slice(start)));
  }

  function updateSearchStatus() {
    const hasMatches = searchMatches.length > 0;
    $("searchPrevious").disabled = !hasMatches;
    $("searchNext").disabled = !hasMatches;
    if (!searchQuery) {
      $("searchResult").textContent = "";
    } else if (!hasMatches) {
      $("searchResult").textContent = `本節找不到「${searchQuery}」`;
    } else {
      const index = searchMatches[searchCursor];
      const volume = volumeFor(index);
      const localNumber = index - volume.start + 1;
      $("searchResult").textContent =
        `第${searchCursor + 1}/${searchMatches.length}處 · 本節第${localNumber}句`;
    }
  }

  function renderNotes() {
    const list = $("noteList");
    list.replaceChildren();
    if (!state.notes.length) {
      const empty = document.createElement("div");
      empty.className = "note-context";
      empty.textContent = "尚無筆記。";
      list.append(empty);
      return;
    }
    state.notes.forEach(note => {
      const item = document.createElement("article");
      item.className = "note-item";
      const remove = document.createElement("button");
      remove.className = "note-delete";
      remove.type = "button";
      remove.dataset.noteId = note.id;
      remove.dataset.noteAction = "delete";
      remove.textContent = "刪除";
      const edit = document.createElement("button");
      edit.className = "note-edit";
      edit.type = "button";
      edit.dataset.noteId = note.id;
      edit.dataset.noteAction = "edit";
      edit.textContent = "編輯";
      const go = document.createElement("button");
      go.className = "note-go";
      go.type = "button";
      go.dataset.noteId = note.id;
      go.dataset.noteAction = "go";
      go.textContent = "前往";
      const meta = document.createElement("div");
      meta.className = "note-meta";
      const timestamp = new Date(note.createdAt);
      const dateText = Number.isNaN(timestamp.getTime()) ? "" : timestamp.toLocaleString("zh-TW", { dateStyle: "medium", timeStyle: "short" });
      meta.textContent = [dateText, note.position, note.audioTime ? `MP3 ${note.audioTime}` : ""].filter(Boolean).join(" · ");
      const sentence = document.createElement("div");
      sentence.className = "note-sentence";
      sentence.textContent = `「${note.sentence || ""}」`;
      item.append(remove, edit, go, meta, sentence);
      if (note.text) {
        const body = document.createElement("div");
        body.className = "note-body";
        body.textContent = note.text;
        item.append(body);
      }
      list.append(item);
    });
  }

  function render() {
    const volume = volumeFor(state.current);
    const inVolume = state.current - volume.start + 1;
    const volumeTotal = volume.end - volume.start + 1;
    const showContext = (id, index) => {
      const element = $(id);
      const exists = validIndex(index);
      element.hidden = !exists;
      element.textContent = exists ? items[index].text : "";
    };
    document.documentElement.style.setProperty("--font-size", `${state.fontSize}px`);
    showContext("previousTwo", state.current - 2);
    showContext("previousOne", state.current - 1);
    showHighlightedSentence($("sentence"), items[state.current].text);
    showContext("nextOne", state.current + 1);
    showContext("nextTwo", state.current + 2);
    $("volumeSelect").value = String(volume.number);
    $("volumePosition").textContent = `第${volume.number}節`;
    const annotation = items[state.current].annotation;
    $("annotationArea").hidden = !annotation;
    $("annotationButton").setAttribute("aria-expanded", "false");
    $("annotationText").hidden = true;
    $("annotationText").textContent = annotation || "";
    const editingNote = state.notes.find(note => note.id === editingNoteId);
    $("noteContext").textContent = editingNote
      ? `正在編輯：${editingNote.position}`
      : `將記錄：第${volume.number}節・第${inVolume}/${volumeTotal}句`;
    $("saveNoteButton").textContent = editingNote ? "更新筆記" : "儲存筆記";
    $("cancelNoteEditButton").hidden = !editingNote;
    renderNotes();
    $("jumpInput").value = String(inVolume);
    $("jumpInput").max = String(volumeTotal);
    $("chapterTotal").textContent = volumeTotal.toLocaleString("zh-TW");
    $("progress").min = "1";
    $("progress").max = volumeTotal;
    $("progress").value = inVolume;
    $("progress").setAttribute(
      "aria-valuetext",
      `第${inVolume}/${volumeTotal}句`
    );
    const progressPercent = volumeTotal > 1
      ? ((inVolume - 1) / (volumeTotal - 1)) * 100
      : 100;
    $("progress").style.setProperty(
      "--range-progress",
      `${progressPercent}%`
    );
    $("previousButton").disabled = state.current <= state.start && !state.finished;
    $("nextButton").disabled = state.finished;
    $("card").disabled = state.finished;
    $("nextButton").textContent = state.finished ? "日誦完成 ✓" : state.current === items.length - 1 ? "完成本次 ✓" : "下一句 →";
    $("hint").textContent = state.finished ? "日誦已完成 · 請選擇段落開始新的一次" : "點按經句或空白鍵：下一句 · ← → 切換 · ↑ ↓ 捲動";
  }

  // 拖曳進度列時只預覽經句；鬆手後才正式切換並儲存位置。
  function previewSentence(index) {
    const savedCurrent = state.current;
    const savedFinished = state.finished;
    state.current = index;
    state.finished = false;
    render();
    state.current = savedCurrent;
    state.finished = savedFinished;
  }

  function counted(delta) {
    const day = todayKey();
    state.sessionCount = Math.max(0, state.sessionCount + delta);
    state.totalCount = Math.max(0, state.totalCount + delta);
    state.daily[day] = Math.max(0, (state.daily[day] || 0) + delta);
  }

  function commit() { save(); render(); }

  function nextSentence() {
    if (state.finished) return;
    counted(1);
    if (state.current === items.length - 1) {
      state.finished = true;
    } else {
      state.current += 1;
    }
    commit();
  }

  function previousSentence() {
    if (state.finished) {
      state.finished = false;
      counted(-1);
    } else if (state.current > state.start) {
      state.current -= 1;
      counted(-1);
    } else {
      return;
    }
    commit();
  }

  function beginAt(index) {
    if (!validIndex(index)) return;
    state.current = index;
    state.start = index;
    state.sessionCount = 0;
    state.finished = false;
    $("notice").textContent = "";
    commit();
  }

  function saveNote() {
    const text = $("noteText").value.trim();
    const audioTime = $("noteAudioTime").value.trim();
    if (!text && !audioTime) {
      $("noteNotice").textContent = "請寫下筆記或 MP3 時間。";
      return;
    }
    const editingNote = state.notes.find(note => note.id === editingNoteId);
    if (editingNote) {
      editingNote.audioTime = audioTime;
      editingNote.text = text;
      editingNote.editedAt = new Date().toISOString();
      editingNoteId = null;
    } else {
      const volume = volumeFor(state.current);
      const localNumber = state.current - volume.start + 1;
      state.notes.unshift({
        id: window.crypto?.randomUUID ? window.crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
        createdAt: new Date().toISOString(),
        index: state.current,
        position: `第${volume.number}節・第${localNumber}/${volume.end - volume.start + 1}句`,
        sentence: items[state.current].text,
        audioTime,
        text
      });
    }
    $("noteText").value = "";
    $("noteAudioTime").value = "";
    $("noteNotice").textContent = "筆記已儲存，會隨進度一併備份。";
    commit();
  }

  function threeVisibleSentences() {
    return [state.current - 1, state.current, state.current + 1]
      .filter(validIndex)
      .map(index => items[index].text)
      .join("\n");
  }

  async function copyVisibleSentences() {
    const text = threeVisibleSentences();
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        helper.style.pointerEvents = "none";
        document.body.appendChild(helper);
        helper.select();
        const copied = document.execCommand("copy");
        helper.remove();
        if (!copied) throw new Error("Copy failed");
      }
      $("copyStatus").textContent = "已複製";
      setTimeout(() => {
        if ($("copyStatus").textContent === "已複製") $("copyStatus").textContent = "";
      }, 1800);
    } catch {
      $("copyStatus").textContent = "無法複製";
    }
  }

  function runSearch() {
    const query = $("searchInput").value.trim();
    searchQuery = query;
    const volume = volumeFor(state.current);
    searchMatches = query
      ? items.slice(volume.start, volume.end + 1).flatMap((item, offset) =>
        item.text.includes(query) ? [volume.start + offset] : []
      )
      : [];
    if (!searchMatches.length) {
      searchCursor = -1;
      updateSearchStatus();
      render();
      return;
    }
    const nextAt = searchMatches.findIndex(index => index >= state.current);
    searchCursor = nextAt >= 0 ? nextAt : 0;
    beginAt(searchMatches[searchCursor]);
    updateSearchStatus();
  }

  function moveSearch(direction) {
    if (!searchMatches.length) {
      runSearch();
      return;
    }
    searchCursor = (
      searchCursor + direction + searchMatches.length
    ) % searchMatches.length;
    beginAt(searchMatches[searchCursor]);
    updateSearchStatus();
  }

  volumes.forEach(volume => {
    const option = document.createElement("option");
    option.value = String(volume.number);
    option.textContent = `${String(volume.number).padStart(2, "0")} · ${volume.name}`;
    $("volumeSelect").appendChild(option);
  });

  $("card").addEventListener("click", event => {
    if (ignoreCardClick) {
      ignoreCardClick = false;
      return;
    }
    const bounds = event.currentTarget.getBoundingClientRect();
    if (event.clientX < bounds.left + bounds.width / 2) previousSentence();
    else nextSentence();
  });
  $("annotationButton").addEventListener("click", () => {
    const text = $("annotationText");
    const opening = text.hidden;
    text.hidden = !opening;
    $("annotationButton").setAttribute("aria-expanded", String(opening));
  });
  $("copyButton").addEventListener("click", copyVisibleSentences);
  $("saveNoteButton").addEventListener("click", saveNote);
  $("cancelNoteEditButton").addEventListener("click", () => {
    editingNoteId = null;
    $("noteText").value = "";
    $("noteAudioTime").value = "";
    $("noteNotice").textContent = "已取消編輯。";
    render();
  });
  $("noteList").addEventListener("click", event => {
    const button = event.target.closest("[data-note-id]");
    if (!button) return;
    const note = state.notes.find(item => item.id === button.dataset.noteId);
    if (!note) return;
    if (button.dataset.noteAction === "edit") {
      editingNoteId = note.id;
      $("noteText").value = note.text || "";
      $("noteAudioTime").value = note.audioTime || "";
      $("noteNotice").textContent = "可修改後按「更新筆記」。";
      render();
      $("noteText").focus();
      return;
    }
    if (button.dataset.noteAction === "go") {
      if (!validIndex(note.index)) return;
      state.current = note.index;
      state.finished = false;
      $("noteNotice").textContent = `已前往：${note.position}`;
      commit();
      $("card").scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (!confirm("刪除此筆記？")) return;
    state.notes = state.notes.filter(item => item.id !== note.id);
    if (editingNoteId === note.id) editingNoteId = null;
    $("noteNotice").textContent = "筆記已刪除。";
    commit();
  });
  $("nextButton").addEventListener("click", nextSentence);
  $("previousButton").addEventListener("click", previousSentence);
  $("volumeSelect").addEventListener("change", event => {
    const volume = volumes.find(item => item.number === Number(event.target.value));
    if (volume) beginAt(volume.start);
  });
  $("smallerButton").addEventListener("click", () => {
    state.fontSize = Math.max(30, state.fontSize - 4);
    commit();
  });
  $("largerButton").addEventListener("click", () => {
    state.fontSize = Math.min(72, state.fontSize + 4);
    commit();
  });
  $("searchToggle").addEventListener("click", () => {
    const willOpen = $("searchPanel").hidden;
    $("searchPanel").hidden = !willOpen;
    $("searchToggle").setAttribute("aria-expanded", String(willOpen));
    if (willOpen) {
      $("searchInput").focus();
      $("searchInput").select();
    }
  });
  $("searchButton").addEventListener("click", runSearch);
  $("searchPrevious").addEventListener("click", () => moveSearch(-1));
  $("searchNext").addEventListener("click", () => moveSearch(1));
  $("searchInput").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      runSearch();
      $("searchInput").blur();
    }
  });
  $("searchInput").addEventListener("search", () => {
    if (!$("searchInput").value) {
      searchQuery = "";
      searchMatches = [];
      searchCursor = -1;
      updateSearchStatus();
      render();
    }
  });
  $("jumpButton").addEventListener("click", () => {
    const volume = volumeFor(state.current);
    const volumeTotal = volume.end - volume.start + 1;
    const localNumber = Number($("jumpInput").value);
    if (!Number.isInteger(localNumber) || localNumber < 1 || localNumber > volumeTotal) {
      $("jumpInput").setCustomValidity(`請輸入1至${volumeTotal}的整數。`);
      $("jumpInput").reportValidity();
      $("notice").textContent = `請輸入1至${volumeTotal}的整數。`;
      return;
    }
    $("jumpInput").setCustomValidity("");
    beginAt(volume.start + localNumber - 1);
  });
  $("jumpInput").addEventListener("input", () => {
    $("jumpInput").setCustomValidity("");
  });
  $("jumpInput").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      $("jumpButton").click();
    }
  });
  $("progress").addEventListener("input", () => {
    const volume = volumeFor(state.current);
    const localNumber = Number($("progress").value);
    previewSentence(volume.start + localNumber - 1);
  });
  $("progress").addEventListener("change", () => {
    const volume = volumeFor(state.current);
    beginAt(volume.start + Number($("progress").value) - 1);
  });
  $("restartButton").addEventListener("click", () => beginAt(volumeFor(state.current).start));
  $("exportButton").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `日誦進度_${todayKey()}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  });
  $("importButton").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async event => {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const imported = JSON.parse(await file.text());
      if (!validState(imported)) throw new Error("invalid backup");
      if (!confirm("匯入將取代目前進度，是否繼續？")) return;
      state = normalizeState(imported);
      $("notice").textContent = "進度已匯入。";
      commit();
    } catch {
      $("notice").textContent = "進度檔格式不正確；目前資料未變更。";
    } finally {
      event.target.value = "";
    }
  });

  document.addEventListener("keydown", event => {
    if (event.target.matches("input, textarea, select, [contenteditable=true]")) return;
    if (event.key === "ArrowRight") {
      event.preventDefault();
      nextSentence();
    } else if (event.key === "ArrowLeft") {
      event.preventDefault();
      previousSentence();
    } else if (event.key === "ArrowDown") {
      event.preventDefault();
      window.scrollBy({
        top: Math.max(160, Math.round(window.innerHeight * .7)),
        behavior: "smooth"
      });
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      window.scrollBy({
        top: -Math.max(160, Math.round(window.innerHeight * .7)),
        behavior: "smooth"
      });
    } else if (event.key === " " && !event.target.matches("button")) {
      event.preventDefault();
      nextSentence();
    }
  });

  let touchStartX = null;
  let touchStartY = null;
  let ignoreCardClick = false;
  $("card").addEventListener("touchstart", event => {
    touchStartX = event.changedTouches[0].clientX;
    touchStartY = event.changedTouches[0].clientY;
  }, { passive: true });
  $("card").addEventListener("touchend", event => {
    if (touchStartX === null || touchStartY === null) return;
    const distanceX = event.changedTouches[0].clientX - touchStartX;
    const distanceY = event.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    touchStartY = null;
    // Kéo để cuộn (hoặc kéo nhẹ) không được coi là chạm để chuyển câu.
    if (Math.abs(distanceY) > 10 || Math.abs(distanceX) > 10) {
      ignoreCardClick = true;
      if (Math.abs(distanceX) >= 55 && Math.abs(distanceX) > Math.abs(distanceY)) {
        event.preventDefault();
        if (distanceX > 0) previousSentence();
        else nextSentence();
      }
      setTimeout(() => { ignoreCardClick = false; }, 450);
      return;
    }
  });

  window.addEventListener("pagehide", save);
  window.addEventListener("blur", save);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") save();
  });
  render();
})();
</script>
</body>
</html>
