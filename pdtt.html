<style>

<script>

{

v:'Sa wa, Ta tha ga ta, Ma ti, Đa sa, Bu mi, Pra tis ti tê.',

},

},
{

s:'Viśuddhe sarvāvaraṇa apāya-durgati pari viśuddhe prati-nivartaya ayuh śuddhe.',
v:'Wi sút đê, Sa wa wa ra na, A pa ya, Đưa ga ti, Pa ri vi sút đê, Pra ti ni wa ta ya, A yu sút đê.',
m:'清淨・一切障礙・惡趣・惡道・徹底清淨・還返・壽命清淨'
},
{
h:'三嘛牙，阿帝斯諦得，咩尼咩尼，嘛哈咩尼，達他答，布達固帝，叭里休帝，維斯普達。',
s:'Samaya adhiṣṭhite maṇi maṇi mahā maṇi tathatā bhūta-koṭi pariśuddhe visphuṭa.',

},
{

s:'Buddhi śuddhe jaya jaya, vijaya vijaya, smara smara sarva buddha adhiṣṭhita.',
v:'Bút đi sút đê, Cha ya cha ya, Wi cha ya, Wi cha ya, Sma ra sma ra, Sa wa, Bút đa, A đis ti ta.',
m:'佛智清淨・勝利勝利・尊勝・最勝・憶念憶念・一切・佛・加持安住'
},
{
h:'休帝，哇茲以哇茲拉，嘎哩瓦將，哇哇督，嘛嘛，薩瑞讓。',
s:'Śuddhe vajri vajra garbhe vajram bhavatu mama sarīram.',
v:'Sút đê, Wa tri wa tra, Ga bê wa trăm, Ba wa tu, Ma ma, Sa ri râm.',
m:'清淨・金剛金剛・金剛藏・願成就・我之・身體'
},
{
h:'薩哇，薩督阿南，佳嘎牙，叭里維修帝，薩哇嘎底，叭里修帝。',
s:'Sarva sattvānām ca kāya pari viśuddhe sarva gati pariśuddhe.',
v:'Sa wa, Sát wa năm, Cha ka ya, Pa ri vi sút đê, Sa wa ga ti, Pa ri sút đê.',
m:'一切・眾生・身・身清淨・一切趣・悉皆清淨'
},
{
h:'札瓦，答他嘎打，辛加美，三嘛，薩沙呀都，薩哇，答他嘎打，三嘛，薩沙呀帝，提得。',
s:'Sarva tathāgata siñca me samā śvāsa yantu. Sarva tathāgata samā śvāsa adhiṣṭhite.',
v:'Sa wa, Ta tha ga ta, Xin cha mê, Sa ma soa sa yan tu, Sa wa, Ta tha ga ta, Sa ma soa sa, A đis ti tê.',
m:'一切・如來・灌頂於我・安慰攝受・一切・如來・安慰攝受・加持安住'
},
{
h:'菩提牙，菩提牙，維菩提牙，維菩提呀，布達牙，布達牙，維布達牙，維布達牙。',
s:'Budhya budhya, vibudhya vibudhya, bodhaya bodhaya, vibodhaya vibodhaya.',
v:'Bu đi ya, Bu đi ya, Vi bu đi ya, Vi bu đi ya, Bồ đà ya, Bồ đà ya, Vi bồ đà ya, Vi bồ đà ya.',
m:'覺悟・覺悟・廣大覺悟・圓滿覺悟・令覺悟・令覺悟・令廣大覺悟・令圓滿覺悟'
},
{
h:'三曼打，叭里修得，薩瓦，答他阿嘎打，綠以達牙，阿提斯打拿，阿提斯帝，答嘛哈，母德列，司乞哈。',
s:'Samanta pariśuddhe sarva tathāgata hṛdaya adhiṣṭhānā dhiṣṭhita mahā-mudre, svāhā.',
v:'Sa man ta, Pa ri shút đê, Sa wa, Ta tha ga ta, Ri đa ya, A đis tá na, Đis tí ta, Ma ha, Mu trê, Soa ha.',
m:'普遍・圓滿清淨・一切・如來・心・加持・安住・大・大印・娑婆訶'
}
];

// ==== LOCAL STORAGE ====
const KEY='pdtt_clean_v3';
const LANGKEY='pdtt_language_v1';
const ZOOMKEY='pdtt_zoom_v1';
const MEANINGKEY='pdtt_meaning_v1';

const $=id=>document.getElementById(id);

let index=0;
let showViet=true;
let showMeaning=false;
let zoom=29;

function clamp(n,lo,hi){
return Math.max(lo,Math.min(hi,n));
}

function load(){
try{
const i=parseInt(localStorage.getItem(KEY),10);
if(Number.isFinite(i)){
index=clamp(i,0,ITEMS.length-1);
}
const l=localStorage.getItem(LANGKEY);
showViet=l!=='sa';

const z=parseInt(localStorage.getItem(ZOOMKEY),10);
if(Number.isFinite(z)){
zoom=clamp(z,18,45);
}
showMeaning=localStorage.getItem(MEANINGKEY)==='yes';
}catch(e){}
}

function save(){
try{
localStorage.setItem(KEY,String(index));
localStorage.setItem(LANGKEY,showViet?'vi':'sa');
localStorage.setItem(ZOOMKEY,String(zoom));
localStorage.setItem(MEANINGKEY,showMeaning?'yes':'no');
}catch(e){}
}

// ==== ZOOM ====
function applyZoom(){
$('zoomSlider').value=zoom;
$('zoomValue').textContent=zoom;

$('han').style.fontSize=zoom+'px';
$('sanskrit').style.fontSize=Math.round(zoom*.76)+'px';
$('viet').style.fontSize=Math.round(zoom*.8)+'px';
$('meaning').style.fontSize=Math.round(zoom*.64)+'px';

save();
}

// ==== RENDER ====
function render(){
const it=ITEMS[index];

$('han').textContent=it.h;
$('sanskrit').textContent=it.s;
$('viet').textContent=it.v;
$('meaning').textContent=it.m;

$('viet').classList.toggle('hidden',!showViet);
$('meaning').classList.toggle('hidden',!showMeaning);

$('vietBtn').classList.toggle('active',showViet);
$('meaningBtn').classList.toggle('active',showMeaning);

$('meaningBtn').textContent=showMeaning?'隱藏義':'顯示義';
$('modeLabel').textContent=showViet?'漢 · 梵 · 越':'漢 · 梵';

$('position').textContent='第 '+(index+1)+' / '+ITEMS.length+' 句';
$('fill').style.width=((index+1)/ITEMS.length*100)+'%';

Array.from($('picker').children).forEach(
(b,i)=>b.classList.toggle('active',i===index)
);

$('reading').scrollTop=0;
applyZoom();
save();
}

// ==== NAVIGATION ====
function go(delta){
index=(index+delta+ITEMS.length)%ITEMS.length;
render();
}

function next(){go(1);}
function prev(){go(-1);}

function resetFirst(){
index=0;
$('picker').classList.remove('show');
render();
}

function toggleViet(){
showViet=!showViet;
render();
}

function toggleMeaning(){
showMeaning=!showMeaning;
render();
}

// ==== VERSE PICKER ====
function buildPicker(){
for(let i=0;i<ITEMS.length;i++){
const b=document.createElement('button');
b.type='button';
b.textContent=String(i+1);

b.addEventListener('click',()=>{
index=i;
$('picker').classList.remove('show');
render();
});

$('picker').appendChild(b);
}
}

// ==== BUTTON EVENTS ====
$('pickBtn').addEventListener('click',()=>{
$('picker').classList.toggle('show');
});

$('resetBtn').addEventListener('click',resetFirst);

$('zoomSlider').addEventListener('input',e=>{
zoom=Number(e.target.value);
applyZoom();
});

$('vietBtn').addEventListener('click',toggleViet);
$('meaningBtn').addEventListener('click',toggleMeaning);
$('prevBtn').addEventListener('click',prev);
$('nextBtn').addEventListener('click',next);

// ==== TOUCH CONTROL ====
// Touch trái: trước
// Touch phải: sau
// Vuốt trái: sau
// Vuốt phải: trước
// Cuộn dọc: không chuyển câu

let start=null;
let ignoreClickUntil=0;
const reading=$('reading');

reading.addEventListener('touchstart',e=>{
if(e.touches.length!==1){
start=null;
return;
}
const t=e.touches[0];
start={
x:t.clientX,
y:t.clientY,
time:Date.now()
};
},{passive:true});

reading.addEventListener('touchcancel',()=>{
start=null;
},{passive:true});

reading.addEventListener('touchend',e=>{
if(!start||!e.changedTouches.length)return;

const t=e.changedTouches[0];
const dx=t.clientX-start.x;
const dy=t.clientY-start.y;
const elapsed=Date.now()-start.time;
const x=start.x;
start=null;

// Vertical scroll
if(Math.abs(dy)>24&&Math.abs(dy)>Math.abs(dx)){
ignoreClickUntil=Date.now()+450;
return;
}

// Horizontal swipe
if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){
e.preventDefault();
ignoreClickUntil=Date.now()+450;
dx<0?next():prev();
return;
}

// Single tap
if(Math.abs(dx)<18&&Math.abs(dy)<18&&elapsed<750){
e.preventDefault();
ignoreClickUntil=Date.now()+450;

if(x<window.innerWidth/2){
prev();
}else{
next();
}
}
},{passive:false});

// Mouse and trackpad fallback
reading.addEventListener('click',e=>{
if(Date.now()<ignoreClickUntil)return;

if(e.clientX<window.innerWidth/2){
prev();
}else{
next();
}
});

// ==== HARDWARE KEYBOARD ====
document.addEventListener('keydown',e=>{
const tag=(e.target&&e.target.tagName||'').toLowerCase();

if(['input','textarea','select'].includes(tag))return;
if(e.repeat||e.altKey||e.metaKey||e.ctrlKey)return;

const k=e.key;

if(k===' '||k==='ArrowRight'||k==='ArrowDown'){
e.preventDefault();
next();
}
else if(k==='ArrowLeft'||k==='ArrowUp'){
e.preventDefault();
prev();
}
else if(k==='v'||k==='V'){
e.preventDefault();
toggleViet();
}
else if(k==='d'||k==='D'){
e.preventDefault();
toggleMeaning();
}
else if(k==='Home'){
e.preventDefault();
resetFirst();
}
});

// ==== INIT ====
function stabilize(){
window.scrollTo(0,0);
}

window.addEventListener('pageshow',stabilize);

buildPicker();
load();
render();
stabilize();

</script>
</body>
